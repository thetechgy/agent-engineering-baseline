name: agent-engineering-baseline
version: 1.0.0
description: Shared APM configuration for Codex CLI and GitHub Copilot CLI
license: MIT
type: hybrid
targets:
  - codex
  - copilot

dependencies:
  apm:
    - github/awesome-copilot/skills/dependabot#1683f50e94c9fd489191f73d7c8f7e2bd871bd0c
    # Retain the reviewed skill until upstream preserves unrelated partial staging.
    - github/awesome-copilot/skills/git-commit#613efc8c21d9b3ce642dff361d17006cd9967e28
    - github/awesome-copilot/skills/github-actions-hardening#1683f50e94c9fd489191f73d7c8f7e2bd871bd0c
    - merill/msgraph/skills/msgraph#6c989c521584e4c356b675d8ba41beadb75afe59
    - addyosmani/agent-skills/skills/code-simplification#8c99fa36d90068c82d547f7c12a9d67a3e95f4ee
    - github/awesome-copilot/skills/microsoft-code-reference#1683f50e94c9fd489191f73d7c8f7e2bd871bd0c
    # GitHub CLI 2.106.0; trunk can document commands absent from released CLIs.
    - cli/cli/skills/gh#529111a21612ff1e29dc45e567a157df24e0e243
  mcp:
    - name: microsoft-learn
      targets: [codex]
      registry: false
      transport: http
      url: https://learn.microsoft.com/api/mcp
      tools:
        - microsoft_docs_search
        - microsoft_docs_fetch
        - microsoft_code_sample_search
      # Supply Codex's native allowlist key through APM's passthrough support.
      enabled_tools:
        - microsoft_docs_search
        - microsoft_docs_fetch
        - microsoft_code_sample_search

includes:
  - .apm/instructions/personal.instructions.md
  - .apm/skills/a11y/
  - .apm/skills/agent-safety/
  - .apm/skills/ansible/
  - .apm/skills/podman/
  - .apm/skills/powershell-pester-6/
  - .apm/skills/powershell-module-engineering/
