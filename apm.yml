name: agent-engineering-baseline
version: 1.0.0
description: Shared APM configuration for Codex CLI and GitHub Copilot CLI
license: MIT
type: hybrid
targets:
  - codex
  - copilot

dependencies:
  apm:
    - github/awesome-copilot/skills/dependabot#main
    # Retain the reviewed skill until upstream preserves unrelated partial staging.
    - github/awesome-copilot/skills/git-commit#613efc8c21d9b3ce642dff361d17006cd9967e28
    - github/awesome-copilot/skills/github-actions-hardening#main
    - merill/msgraph/skills/msgraph#main
    - addyosmani/agent-skills/skills/code-simplification#main
    - github/awesome-copilot/skills/microsoft-code-reference#main
    # GitHub CLI 2.103.3; trunk can document commands absent from released CLIs.
    - cli/cli/skills/gh#63837fb778d6a39f02be0ce76ff89f2bc8d74bdc
  mcp:
    - name: microsoft-learn
      registry: false
      transport: http
      url: https://learn.microsoft.com/api/mcp
      tools: &microsoft_learn_tools
        - microsoft_docs_search
        - microsoft_docs_fetch
        - microsoft_code_sample_search
      # Supply Codex's native allowlist key through APM's passthrough support.
      enabled_tools: *microsoft_learn_tools

includes:
  - .apm/instructions/personal.instructions.md
  - .apm/skills/a11y/
  - .apm/skills/agent-safety/
  - .apm/skills/ansible/
  - .apm/skills/podman/
  - .apm/skills/powershell-pester-6/
  - .apm/skills/powershell-module-engineering/
