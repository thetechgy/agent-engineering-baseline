name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Full validation (PowerShell 7 and Bash)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned APM CLI
        shell: bash
        run: |
          version="$(head -n 1 .apm-version | tr -d '[:space:]')"
          case "$(uname -m)" in
            x86_64) platform_arch='x86_64' ;;
            arm64|aarch64) platform_arch='arm64' ;;
            *) echo 'Unsupported Linux architecture.' >&2; exit 1 ;;
          esac
          archive="apm-linux-$platform_arch.tar.gz"
          archive_root="apm-linux-$platform_arch"
          member="$archive_root/apm"
          secure_root="$RUNNER_TEMP/apm-secure-install"
          installer="$secure_root/install.sh"
          archive_path="$secure_root/$archive"
          mkdir -p "$secure_root/extract" "$secure_root/mirror/v$version"
          curl --fail --location --silent --show-error --output "$installer" \
            "https://raw.githubusercontent.com/microsoft/apm/v$version/install.sh"
          curl --fail --location --silent --show-error --output "$archive_path" \
            "https://github.com/microsoft/apm/releases/download/v$version/$archive"
          verify_checksum() {
            expected="$(awk -v name="$2" '$2 == name { print $1 }' .apm-checksums)"
            [ "$(printf '%s\n' "$expected" | wc -l)" -eq 1 ]
            printf '%s\n' "$expected" | grep -Eq '^[0-9a-f]{64}$'
            printf '%s  %s\n' "$expected" "$1" | sha256sum --check --strict -
          }
          verify_checksum "$installer" install.sh
          verify_checksum "$archive_path" "$archive"
          tar -tzf "$archive_path" | awk -v root="$archive_root" -v member="$member" '
            BEGIN { valid = 1; count = 0 }
            {
              if ($0 == member) count++
              if ($0 != root && index($0, root "/") != 1) valid = 0
              if ($0 ~ /^\// || $0 ~ /(^|\/)\.\.($|\/)/) valid = 0
            }
            END { exit(valid && count == 1 ? 0 : 1) }
          tar -xzf "$archive_path" -C "$secure_root/extract"
          [ -z "$(find "$secure_root/extract/$archive_root" -type l -print -quit)" ]
          verify_checksum "$secure_root/extract/$member" "$member"
          cp "$archive_path" "$secure_root/mirror/v$version/$archive"
          verify_checksum "$secure_root/mirror/v$version/$archive" "$archive"
          APM_INSTALL_DIR="$RUNNER_TEMP/apm-bin" \
            APM_RELEASE_BASE_URL="file://$secure_root/mirror" \
            APM_NO_DIRECT_FALLBACK=1 VERSION="v$version" sh "$installer"
          installed="$RUNNER_TEMP/lib/apm/apm"
          verify_checksum "$installed" "$member"
          "$installed" --version
          dirname "$installed" >> "$GITHUB_PATH"

      - name: Install validation tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          pipx install rumdl==0.2.34

      - name: Run full validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Invoke-Validation.ps1

      - name: Require clean regeneration
        run: |
          git diff --exit-code -- . ':(exclude)apm.lock.yaml'
          git diff -I '^generated_at:' --exit-code -- apm.lock.yaml
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked files:'
            echo "$untracked"
            exit 1
          fi

  windows-powershell:
    name: Pester and analyzer (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run Pester and PSScriptAnalyzer
        shell: powershell
        run: ./scripts/Invoke-Validation.ps1 -Suite Pester
