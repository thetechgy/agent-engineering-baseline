name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Full validation (PowerShell 7 and Bash)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned APM CLI
        shell: bash
        run: |
          version="$(head -n 1 .apm-version | tr -d '[:space:]')"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          installer="$RUNNER_TEMP/apm-install.sh"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$installer" \
            "https://raw.githubusercontent.com/microsoft/apm/v$version/install.sh"
          VERSION="v$version" APM_INSTALL_DIR="$RUNNER_TEMP/apm-bin" sh "$installer"
          installed="$("$RUNNER_TEMP/apm-bin/apm" --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ "$installed" != "$version" ]; then
            printf 'Installed APM CLI v%s does not match the pinned v%s.\n' "$installed" "$version" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/apm-bin" >> "$GITHUB_PATH"

      - name: Install validation tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          pipx install rumdl==0.2.34

      - name: Run full validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Invoke-Validation.ps1

      - name: Require clean regeneration
        run: |
          git diff --exit-code -- . ':(exclude)apm.lock.yaml'
          git diff -I '^generated_at:' --exit-code -- apm.lock.yaml
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked files:'
            echo "$untracked"
            exit 1
          fi

  windows-powershell:
    name: Pester and analyzer (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run Pester and PSScriptAnalyzer
        shell: powershell
        run: ./scripts/Invoke-Validation.ps1 -Suite Pester
