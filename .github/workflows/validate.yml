name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PESTER_VERSION: '6.2.0'
  PSSCRIPTANALYZER_VERSION: '1.25.0'

# Preserve all main producers and diagnostic reruns; only initial PR runs supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  plan:
    name: Select credential-free validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.impact.outputs.contracts }}
      quality: ${{ steps.impact.outputs.quality }}
      pester: ${{ steps.impact.outputs.pester }}
      evaluator: ${{ steps.impact.outputs.evaluator }}
      deadline: ${{ steps.impact.outputs.deadline }}
      admission: ${{ steps.impact.outputs.admission }}
      legacy: ${{ steps.impact.outputs.legacy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify selection and failure propagation controls
        run: python3 -B -m unittest discover -s .github/tests -p test_ci_routing.py -v
      - name: Select from the complete Git comparison
        id: impact
        run: python3 -B .github/scripts/ci_routing.py plan

  pester-eval-feasibility:
    needs: plan
    if: needs.plan.outputs.pester == 'true'
    name: Pester evaluation feasibility (no inference)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified test-only Docker Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Install the existing pinned evaluator
        timeout-minutes: 15
        run: bash .github/scripts/setup-skillevaluator.sh benchmark
      - name: Verify retained-runtime image preparation contracts
        env:
          IMAGE_PREPARATION_RUNTIME: retained
        run: '"$SKILL_EVALUATOR_PYTHON" -B -m unittest discover -s .github/tests -p test_image_preparation.py -v'
      - name: Prepare pinned Pester packages under the retained owning runtime
        timeout-minutes: 23
        run: '"$SKILL_EVALUATOR_PYTHON" .github/scripts/prepare_candidate_images.py --runtime retained --output "$RUNNER_TEMP/pester-package-preparation.json"'
      - name: Retain bounded preparation checkpoint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-pester-package-preparation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pester-package-preparation.json
          if-no-files-found: error
          retention-days: 14
      - name: Install fresh verified Compose configuration for native phase
        run: |
          printf 'PREPARATION_COMPOSE_PLUGIN_ROOT=%s\n' "$COMPOSE_PLUGIN_ROOT" >> "$GITHUB_ENV"
          bash .github/scripts/setup-compose.sh
      - name: Qualify native Pester execution and diagnostic containment
        id: qualification
        timeout-minutes: 30
        run: '"$SKILL_EVALUATOR_PYTHON" .github/scripts/pester_container_validation.py'
      - name: Verify checkout integrity
        id: pester-integrity
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
      - name: Upload validated public Pester oracle evidence
        if: success() && steps.qualification.outcome == 'success' && steps.pester-integrity.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-public-oracle-powershell-pester-6-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pester-gate-artifacts/reporting/public/inventory/inventory.json
            ${{ runner.temp }}/pester-gate-artifacts/reporting/public/skills/*/behavioral/*/public-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain shared sanitized qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-feasibility-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pester-gate-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove test-only Compose plugin
        if: always()
        run: |
          bash .github/scripts/setup-compose.sh cleanup
          if [[ -n "${PREPARATION_COMPOSE_PLUGIN_ROOT:-}" ]]; then
            COMPOSE_PLUGIN_ROOT="$PREPARATION_COMPOSE_PLUGIN_ROOT" bash .github/scripts/setup-compose.sh cleanup
          fi

  ci-contracts:
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    name: CI contracts (no inference)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an initially clean checkout
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
          python3 .github/scripts/skill_reports.py preflight

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: false

      - name: Install evaluator and security scanners with Python 3.13
        run: bash .github/scripts/setup-skillevaluator.sh quality

      - name: Test CI contracts without inference
        run: |
          shellcheck .github/scripts/setup-skillevaluator.sh .github/scripts/setup-compose.sh
          "$SKILL_REVIEW_PYTHON" -m unittest discover -s .github/tests -v
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_evaluations.py validate gh
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_evaluations.py replay gh
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_evaluations.py stage gh "$RUNNER_TEMP/gh-eval-bundle/gh"
          skillevaluator tier3 validate "$RUNNER_TEMP/gh-eval-bundle/gh" --strict --json

      - name: Verify contract tests left the checkout unchanged
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"

  skill-quality:
    name: Skill quality (advisory findings)
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an initially clean checkout
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
          python3 .github/scripts/skill_reports.py preflight

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: false

      - name: Install evaluator and security scanners with Python 3.13
        run: bash .github/scripts/setup-skillevaluator.sh quality

      - name: Install verified test-only Docker Compose
        run: bash .github/scripts/setup-compose.sh

      - name: Validate native gh Docker boundary without inference or credentials
        run: '"$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_container_validation.py'

      - name: Remove test-only Compose plugin
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup

      - name: Qualify scanner controls and consolidated reporting without credentials
        run: |
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/qualify_scanners.py \
            --tools "$RUNNER_TEMP/skill-evaluation-tools" --output "$RUNNER_TEMP/scanner-controls"

      - name: Retain scanner controls and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-controls
          path: ${{ runner.temp }}/scanner-controls/
          if-no-files-found: error
          retention-days: 14

      - name: Collect native skill and dataset reports
        env:
          SKILLEVALUATOR_RESULTS_DIR: ${{ runner.temp }}/skill-quality/results
        run: |
          set -euo pipefail
          report_root="$RUNNER_TEMP/skill-quality"
          mkdir -p "$report_root/reports" "$report_root/datasets"
          cp "$RUNNER_TEMP/skill-evaluation-tools/versions.json" "$report_root/versions.json"
          cp -r "$RUNNER_TEMP/skill-evaluation-tools/dependencies" "$report_root/dependencies"
          cd "$report_root"
          status=0
          skillevaluator validate "$GITHUB_WORKSPACE/.apm/skills" \
            --external --tiers 1 --no-llm --no-dedup --continue-on-failure \
            --evaluated-source-repository "$GITHUB_REPOSITORY" \
            --evaluated-source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            -r json,markdown,html -o "$report_root/reports" || status=$?
          printf '%s\n' "$status" > "$report_root/catalog.exit"
          for dataset in "$GITHUB_WORKSPACE"/.apm/skills/*/evals/evals.json; do
            if [ -L "$dataset" ]; then
              echo '::error::Linked evaluation dataset is not allowed.'
              exit 1
            fi
            [ -f "$dataset" ] || continue
            skill_dir="$(dirname "$(dirname "$dataset")")"
            skill="$(basename "$skill_dir")"
            status=0
            skillevaluator tier3 validate "$skill_dir" --strict --json \
              > "$report_root/datasets/$skill.json" \
              2> "$report_root/datasets/$skill.stderr" || status=$?
            printf '%s\n' "$status" > "$report_root/datasets/$skill.exit"
          done

      - name: Enforce native collection and dataset contracts
        id: native-quality
        if: always()
        run: python3 .github/scripts/skill_reports.py catalog "$RUNNER_TEMP/skill-quality"

      - name: Generate validated public quality evidence and findings summary
        id: public-quality
        if: always() && env.SKILL_EVALUATOR_PYTHON != ''
        timeout-minutes: 3
        run: |
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_reports.py public-quality \
            "$RUNNER_TEMP/skill-quality" "$RUNNER_TEMP/skill-public-quality"

      - name: Report quality summary availability
        if: always()
        env:
          PUBLIC_QUALITY_OUTCOME: ${{ steps.public-quality.outcome }}
          NATIVE_QUALITY_OUTCOME: ${{ steps.native-quality.outcome }}
        run: |
          if [ "$PUBLIC_QUALITY_OUTCOME" != success ]; then
            echo '**Validated findings summary unavailable: projection failed, was interrupted, or was skipped. This is not a zero-finding result. Inspect collection/projection steps and the skill-quality artifact.**' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$NATIVE_QUALITY_OUTCOME" != success ]; then
            echo '**Native infrastructure validation did not succeed. Any retained findings summary cannot override this failure.**' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify evaluator left the checkout unchanged
        id: public-quality-integrity
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"

      - name: Upload validated public quality evidence
        if: always() && steps.public-quality.outcome == 'success' && steps.public-quality-integrity.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-public-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skill-public-quality/inventory/inventory.json
            ${{ runner.temp }}/skill-public-quality/skills/*/static/public-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload skill quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-quality
          path: ${{ runner.temp }}/skill-quality/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Full validation (PowerShell 7 and Bash)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire latest stable PowerShell
        shell: pwsh
        run: |
          python .github/scripts/install_ci_powershell.py --destination "$env:RUNNER_TEMP/baseline-ci-pwsh" --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw 'Latest stable PowerShell acquisition failed.' }

      - name: Install pinned APM CLI
        shell: bash
        run: |
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" ./scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"

      - name: Verify native scoped installation and update behavior
        shell: bash
        run: python3 tests/bootstrap_lifecycle.py --apm "$APM_EXECUTABLE"

      - name: Install validation tools
        timeout-minutes: 5
        shell: pwsh
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            . ./scripts/Install-CIValidationModule.ps1
            Install-CIValidationModule -Name Pester -RequiredVersion $env:PESTER_VERSION
            Install-CIValidationModule -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          }
          if ($LASTEXITCODE -ne 0) { throw 'Validation tool installation failed.' }

      - name: Install hash-locked Markdown linter
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/rumdl"
          "$RUNNER_TEMP/rumdl/bin/pip" install --quiet --require-hashes --only-binary :all: \
            --requirement .github/requirements/rumdl.txt
          "$RUNNER_TEMP/rumdl/bin/rumdl" --version
          echo "$RUNNER_TEMP/rumdl/bin" >> "$GITHUB_PATH"

      - name: Run full validation
        shell: pwsh
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            . ./scripts/Install-CIValidationModule.ps1
            Import-CIValidationModule -Name Pester -RequiredVersion $env:PESTER_VERSION
            Import-CIValidationModule -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
            ./scripts/Invoke-Validation.ps1
          }
          if ($LASTEXITCODE -ne 0) { throw 'Full validation failed.' }

      - name: Acquire declared frozen-grader runtime
        shell: bash
        run: python3 -B .github/scripts/install_ci_powershell.py --runtime frozen-pester --destination "$RUNNER_TEMP/frozen-pester" --github-env "$GITHUB_ENV"

      - name: Check exploratory Pester candidate with the existing grader
        shell: bash
        env:
          CI_PWSH: ${{ env.FROZEN_PWSH }}
          PESTER_MANIFEST: ${{ env.FROZEN_PESTER_MANIFEST }}
          PESTER_EFFECTIVENESS_LOCAL_SEMANTICS: '1'
          PESTER_EFFECTIVENESS_EVIDENCE: ${{ runner.temp }}/pester-ceiling-components
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s .github/tests -p test_pester_ceiling.py -v

      - name: Retain exploratory Pester component evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-ceiling-components
          path: ${{ runner.temp }}/pester-ceiling-components/
          if-no-files-found: error
          retention-days: 90

      - name: Require clean regeneration
        run: |
          git diff --exit-code -- . ':(exclude)apm.lock.yaml'
          git diff -I '^generated_at:' --exit-code -- apm.lock.yaml
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked files:'
            echo "$untracked"
            exit 1
          fi

  windows-powershell:
    name: Pester and analyzer (latest stable PowerShell)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire latest stable PowerShell
        shell: pwsh
        run: |
          python .github/scripts/install_ci_powershell.py --destination "$env:RUNNER_TEMP/baseline-ci-pwsh" --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw 'Latest stable PowerShell acquisition failed.' }

      - name: Install validation tools
        timeout-minutes: 5
        shell: pwsh
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            . ./scripts/Install-CIValidationModule.ps1
            Install-CIValidationModule -Name Pester -RequiredVersion $env:PESTER_VERSION
            Install-CIValidationModule -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          }
          if ($LASTEXITCODE -ne 0) { throw 'Validation tool installation failed.' }

      - name: Run Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            . ./scripts/Install-CIValidationModule.ps1
            Import-CIValidationModule -Name Pester -RequiredVersion $env:PESTER_VERSION
            Import-CIValidationModule -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
            ./scripts/Invoke-Validation.ps1 -Suite Pester
          }
          if ($LASTEXITCODE -ne 0) { throw 'Pester and analyzer validation failed.' }

      - name: Acquire the reviewed CLI with the real installer (PowerShell 7)
        shell: pwsh
        env:
          APM_INSTALL_DIR: ${{ runner.temp }}\apm-pwsh\bin
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            ./scripts/Bootstrap-Baseline.ps1 -CliOnly
            $expected = (Get-Content -LiteralPath .apm-version -TotalCount 1).Trim()
            $reported = (& (Join-Path $env:APM_INSTALL_DIR 'apm.cmd') --version) -join ' '
            Write-Host $reported
            if ($LASTEXITCODE -ne 0 -or $reported -notlike "*$expected*") {
              throw "Installed CLI reported '$reported', expected version $expected"
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed CLI acquisition failed.' }
          $executables = @(Get-ChildItem -Path "$env:APM_INSTALL_DIR/../releases/v*/apm.exe" -File)
          if ($executables.Count -ne 1) { throw 'Expected exactly one reviewed CLI generation.' }
          python tests/bootstrap_lifecycle.py --apm $executables[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native scoped lifecycle validation failed.' }

  current-evaluator:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.evaluator == 'true'
    uses: ./.github/workflows/current-evaluator.yml

  native-deadline:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.deadline == 'true'
    uses: ./.github/workflows/native-deadline.yml

  pester-admission:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.admission == 'true'
    uses: ./.github/workflows/pester-admission-qualification.yml

  codex-pilot:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.legacy == 'true'
    uses: ./.github/workflows/codex-pilot.yml

  validation:
    name: Selected validation results
    if: always()
    needs: [plan, ci-contracts, linux, windows-powershell, skill-quality, pester-eval-feasibility, current-evaluator, native-deadline, pester-admission, codex-pilot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B .github/scripts/ci_routing.py gate
