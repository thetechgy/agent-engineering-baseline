name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Full validation (PowerShell 7 and Bash)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked APM CLI
        run: |
          tag="$(awk '$1 == "tag:" { print $2; exit }' apm-cli.lock.yml)"
          archive_name="$(awk '
            $0 == "  linux-x86_64:" { found=1; next }
            found && $1 == "name:" { print $2; exit }
          ' apm-cli.lock.yml)"
          archive_hash="$(awk '
            $0 == "  linux-x86_64:" { found=1; next }
            found && $1 == "sha256:" { print $2; exit }
          ' apm-cli.lock.yml)"
          archive="$RUNNER_TEMP/$archive_name"
          install_dir="$RUNNER_TEMP/apm"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/microsoft/apm/releases/download/$tag/$archive_name"
          echo "$archive_hash  $archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install validation tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          pipx install rumdl==0.2.34

      - name: Run full validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Invoke-Validation.ps1

      - name: Require clean regeneration
        run: |
          git diff --exit-code -- . ':(exclude)apm.lock.yaml'
          git diff -I '^generated_at:' --exit-code -- apm.lock.yaml
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked files:'
            echo "$untracked"
            exit 1
          fi

  windows-powershell:
    name: Pester and analyzer (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run Pester
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 6.1.0 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests/Bootstrap-Global.Tests.ps1'
          $configuration.Run.PassThru = $true
          $configuration.Run.Throw = $false
          $configuration.Should.DisableV5 = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed test(s)."
          }

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $results = @()
          foreach ($path in @(Get-ChildItem ./scripts, ./tests -Filter '*.ps1' -File -Recurse)) {
              $results += @(Invoke-ScriptAnalyzer -Path $path.FullName -Severity Warning,Error)
          }
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -Wrap
          if ($results.Count -gt 0) {
              throw "PSScriptAnalyzer reported $($results.Count) finding(s)."
          }
