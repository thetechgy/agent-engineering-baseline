name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill-quality:
    name: Skill quality (advisory findings)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an initially clean checkout
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
          python3 .github/scripts/skill_reports.py preflight

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Install evaluator and security scanners with Python 3.13
        run: bash .github/scripts/setup-skillevaluator.sh quality

      - name: Test CI contracts without inference
        run: |
          shellcheck .github/scripts/setup-skillevaluator.sh
          "$SKILL_EVALUATOR_PYTHON" -m unittest discover -s .github/tests -v
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_evaluations.py validate gh
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_evaluations.py replay gh
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_evaluations.py stage gh "$RUNNER_TEMP/gh-eval-bundle/gh"
          skillevaluator tier3 validate "$RUNNER_TEMP/gh-eval-bundle/gh" --strict --json

      - name: Install test-only Docker Compose 5.0.2 plugin
        run: |
          set -euo pipefail
          plugin_root="$RUNNER_TEMP/gh-compose-validation"
          mkdir -p "$plugin_root/cli-plugins"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            https://github.com/docker/compose/releases/download/v5.0.2/docker-compose-linux-x86_64 \
            --output "$plugin_root/cli-plugins/docker-compose"
          printf '%s  %s\n' 2d880f723d3da7c779c54fdaea91a842fca8af55d1397f1ed8d7cbab3dd7af67 \
            "$plugin_root/cli-plugins/docker-compose" | sha256sum --check --strict
          chmod 755 "$plugin_root/cli-plugins/docker-compose"
          printf 'DOCKER_CONFIG=%s\n' "$plugin_root" >> "$GITHUB_ENV"

      - name: Validate native gh Docker boundary without inference or credentials
        run: '"$SKILL_EVALUATOR_PYTHON" .github/scripts/gh_container_validation.py'

      - name: Remove test-only Compose plugin
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/gh-compose-validation"

      - name: Collect native skill and dataset reports
        env:
          SKILLEVALUATOR_RESULTS_DIR: ${{ runner.temp }}/skill-quality/results
        run: |
          set -euo pipefail
          report_root="$RUNNER_TEMP/skill-quality"
          mkdir -p "$report_root/reports" "$report_root/datasets"
          cp "$RUNNER_TEMP/skill-evaluation-tools/versions.json" "$report_root/versions.json"
          cp -r "$RUNNER_TEMP/skill-evaluation-tools/dependencies" "$report_root/dependencies"
          cd "$report_root"
          status=0
          skillevaluator validate "$GITHUB_WORKSPACE/.apm/skills" \
            --external --tiers 1 --no-llm --no-dedup --continue-on-failure \
            --evaluated-source-repository "$GITHUB_REPOSITORY" \
            --evaluated-source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            -r json,markdown,html -o "$report_root/reports" || status=$?
          printf '%s\n' "$status" > "$report_root/catalog.exit"
          for dataset in "$GITHUB_WORKSPACE"/.apm/skills/*/evals/evals.json; do
            if [ -L "$dataset" ]; then
              echo '::error::Linked evaluation dataset is not allowed.'
              exit 1
            fi
            [ -f "$dataset" ] || continue
            skill_dir="$(dirname "$(dirname "$dataset")")"
            skill="$(basename "$skill_dir")"
            status=0
            skillevaluator tier3 validate "$skill_dir" --strict --json \
              > "$report_root/datasets/$skill.json" \
              2> "$report_root/datasets/$skill.stderr" || status=$?
            printf '%s\n' "$status" > "$report_root/datasets/$skill.exit"
          done

      - name: Summarize findings and enforce infrastructure contracts
        if: always()
        run: python3 .github/scripts/skill_reports.py catalog "$RUNNER_TEMP/skill-quality"

      - name: Generate validated public quality evidence
        id: public-quality
        if: always() && env.SKILL_EVALUATOR_PYTHON != ''
        timeout-minutes: 3
        run: |
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_reports.py public-quality \
            "$RUNNER_TEMP/skill-quality" "$RUNNER_TEMP/skill-public-quality"

      - name: Verify evaluator left the checkout unchanged
        id: public-quality-integrity
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"

      - name: Upload validated public quality evidence
        if: always() && steps.public-quality.outcome == 'success' && steps.public-quality-integrity.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-public-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skill-public-quality/inventory/inventory.json
            ${{ runner.temp }}/skill-public-quality/skills/*/static/public-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload skill quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-quality
          path: ${{ runner.temp }}/skill-quality/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Full validation (PowerShell 7 and Bash)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire latest stable PowerShell
        shell: pwsh
        run: |
          python .github/scripts/install_ci_powershell.py --destination "$env:RUNNER_TEMP/baseline-ci-pwsh" --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw 'Latest stable PowerShell acquisition failed.' }

      - name: Install pinned APM CLI
        shell: bash
        run: |
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" ./scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"

      - name: Install validation tools
        shell: pwsh
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }
          if ($LASTEXITCODE -ne 0) { throw 'Validation tool installation failed.' }

      - name: Install hash-locked Markdown linter
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/rumdl"
          "$RUNNER_TEMP/rumdl/bin/pip" install --quiet --require-hashes --only-binary :all: \
            --requirement .github/requirements/rumdl.txt
          "$RUNNER_TEMP/rumdl/bin/rumdl" --version
          echo "$RUNNER_TEMP/rumdl/bin" >> "$GITHUB_PATH"

      - name: Run full validation
        shell: pwsh
        run: '& $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -File ./scripts/Invoke-Validation.ps1'

      - name: Require clean regeneration
        run: |
          git diff --exit-code -- . ':(exclude)apm.lock.yaml'
          git diff -I '^generated_at:' --exit-code -- apm.lock.yaml
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked files:'
            echo "$untracked"
            exit 1
          fi

  windows-powershell:
    name: Pester and analyzer (latest stable PowerShell)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire latest stable PowerShell
        shell: pwsh
        run: |
          python .github/scripts/install_ci_powershell.py --destination "$env:RUNNER_TEMP/baseline-ci-pwsh" --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw 'Latest stable PowerShell acquisition failed.' }

      - name: Install validation tools
        shell: pwsh
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }
          if ($LASTEXITCODE -ne 0) { throw 'Validation tool installation failed.' }

      - name: Run Pester and PSScriptAnalyzer
        shell: pwsh
        run: '& $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -File ./scripts/Invoke-Validation.ps1 -Suite Pester'

      - name: Acquire the reviewed CLI with the real installer (PowerShell 7)
        shell: pwsh
        env:
          APM_INSTALL_DIR: ${{ runner.temp }}\apm-pwsh\bin
        run: |
          & $env:CI_PWSH -NoLogo -NoProfile -NonInteractive -Command {
            $ErrorActionPreference = 'Stop'
            ./scripts/Bootstrap-Baseline.ps1 -CliOnly
            $expected = (Get-Content -LiteralPath .apm-version -TotalCount 1).Trim()
            $reported = (& (Join-Path $env:APM_INSTALL_DIR 'apm.cmd') --version) -join ' '
            Write-Host $reported
            if ($LASTEXITCODE -ne 0 -or $reported -notlike "*$expected*") {
              throw "Installed CLI reported '$reported', expected version $expected"
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed CLI acquisition failed.' }
