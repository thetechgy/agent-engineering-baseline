name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  APM_VERSION: '0.28.0'
  APM_SHA256: 7edab3baba96658a20120fc8f3012e3223da7924937a8cbf169bf9805853b8d7
  PESTER_VERSION: '6.1.0'
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  validate:
    name: APM frozen install, compile, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install APM
        run: |
          archive="$RUNNER_TEMP/apm.tar.gz"
          install_dir="$RUNNER_TEMP/apm"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/microsoft/apm/releases/download/v${APM_VERSION}/apm-linux-x86_64.tar.gz"
          echo "${APM_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Show APM version
        run: apm --version

      - name: Install dependencies from lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm install --frozen

      - name: Validate compiled instructions
        run: apm compile --target codex,copilot --validate

      - name: Compile instructions
        run: apm compile --target codex,copilot

      - name: Audit deployment integrity
        run: apm audit --ci

      - name: Check for repository drift
        run: |
          # APM rewrites only the lockfile generated_at timestamp on install.
          git diff --exit-code -- . ':(exclude)apm.lock.yaml'
          git diff -I '^generated_at:' --exit-code -- apm.lock.yaml
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo 'Unexpected untracked files:'
            echo "$untracked"
            exit 1
          fi

  bootstrap-ubuntu:
    name: Bootstrap scripts (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: |
          bash -n scripts/bootstrap-global.sh
          bash -n tests/bootstrap-global.sh

      - name: Run ShellCheck
        run: shellcheck scripts/bootstrap-global.sh tests/bootstrap-global.sh

      - name: Run Bash behavior tests
        run: ./tests/bootstrap-global.sh

      - name: Install pinned PowerShell test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force

      - name: Run Pester behavior tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests/Bootstrap-Global.Tests.ps1'
          $configuration.Run.PassThru = $true
          $configuration.Run.Throw = $false
          $configuration.Should.DisableV5 = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed test(s)."
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $results = @()
          foreach ($path in @(
              './scripts/Bootstrap-Global.ps1'
              './tests/Bootstrap-Global.Tests.ps1'
              './tests/fixtures/Fake-BootstrapTool.ps1'
          )) {
              $results += @(Invoke-ScriptAnalyzer -Path $path -Severity Warning,Error)
          }
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -Wrap
          if ($results.Count -gt 0) {
              throw "PSScriptAnalyzer reported $($results.Count) warning or error finding(s)."
          }

  bootstrap-windows:
    name: Bootstrap scripts (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned PowerShell test tools
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force

      - name: Run Pester behavior tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests/Bootstrap-Global.Tests.ps1'
          $configuration.Run.PassThru = $true
          $configuration.Run.Throw = $false
          $configuration.Should.DisableV5 = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed test(s)."
          }

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $results = @()
          foreach ($path in @(
              './scripts/Bootstrap-Global.ps1'
              './tests/Bootstrap-Global.Tests.ps1'
              './tests/fixtures/Fake-BootstrapTool.ps1'
          )) {
              $results += @(Invoke-ScriptAnalyzer -Path $path -Severity Warning,Error)
          }
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -Wrap
          if ($results.Count -gt 0) {
              throw "PSScriptAnalyzer reported $($results.Count) warning or error finding(s)."
          }
