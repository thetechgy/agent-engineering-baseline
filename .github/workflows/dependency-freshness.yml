name: Dependency freshness

on:
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-freshness
  cancel-in-progress: false

jobs:
  discover:
    name: Read-only dependency discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact_ready: ${{ steps.artifact.outcome == 'success' }}
    steps:
      - name: Check out the observed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Exit 1 retains a validated partial report and leaves this job failed.
      # Do not use continue-on-error: a successful publisher cannot erase failure.
      - name: Discover releases and public advisories
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/scripts/dependency_freshness.py check --output "$RUNNER_TEMP/dependency-freshness"

      - name: Retain complete or partial report
        id: artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-freshness/report.json
            ${{ runner.temp }}/dependency-freshness/report.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Maintain dependency tracking issue
    needs: discover
    # A failed discovery may have a useful partial report. Explicit always()
    # overrides the implicit success() dependency gate; cancellation never writes.
    if: >-
      always() && !cancelled() &&
      needs.discover.outputs.artifact_ready == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted publisher at the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download data-only discovery result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-freshness-input

      - name: Validate result and update the single tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/scripts/dependency_freshness.py publish --report "$RUNNER_TEMP/dependency-freshness-input/report.json"
