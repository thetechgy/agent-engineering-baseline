name: Current evaluator report qualification

on:
  workflow_dispatch:
    inputs:
      candidate-next:
        description: Qualify the separately pinned 0.9.0 runtime
        type: boolean
        default: false
      startup-only:
        description: Run gh-007 startup only, without agents or grading
        type: boolean
        default: false
      startup-owner:
        description: Evaluator for the startup-only qualification
        type: choice
        options: ['0.9.0', '1.0.1']
        default: '0.9.0'
      benchmark-121-fixtures:
        description: Qualify the 1.0.1 benchmark candidate with deterministic gh and Pester fixtures
        type: boolean
        default: false
      benchmark-121-podman:
        description: Qualify 1.0.1 isolated Podman and offline publication
        type: boolean
        default: false
      benchmark-121-codex:
        description: Qualify the 1.0.1 Codex launch with the non-forwarding loopback fixture
        type: boolean
        default: false
      benchmark-121-launcher:
        description: Qualify the released paired launcher with isolated non-forwarding Docker fixtures
        type: boolean
        default: false

permissions:
  contents: read

env:
  CANDIDATE_SETUP_KIND: ${{ inputs.candidate-next && 'candidate-next' || 'candidate-current' }}

jobs:
  cohorts:
    if: ${{ !inputs.startup-only && !inputs.benchmark-121-fixtures && !inputs.benchmark-121-codex && !inputs.benchmark-121-podman && !inputs.benchmark-121-launcher }}
    name: Candidate native oracle cohorts (no inference)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Recover the frozen gh fixture authored revision.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install pinned evaluator for public data
        run: bash .github/scripts/setup-static-evaluator.sh data-host
      - name: Verify retained report presentation without inference
        run: '"$SKILL_DATA_PYTHON" -B .github/scripts/test_evaluation_contracts.py presentation'
      - name: Install released native dependencies for custom report admission
        run: bash .github/scripts/setup-static-evaluator.sh native-benchmark-candidate
      - name: Install the pinned private review test environment
        run: bash .github/scripts/setup-static-evaluator.sh review-contracts
      - name: Install retained private-review validators
        run: bash .github/scripts/setup-static-evaluator.sh review-retained-101
      - name: Verify historical report and custom semantics
        run: |
          "$SKILL_NATIVE_BENCHMARK_CANDIDATE_PYTHON" -B -m unittest discover -s .github/tests -p test_custom_metrics.py
          PYTHONPATH=.github/scripts:.github/tests "$SKILL_DATA_PYTHON" -B -m unittest \
            test_skill_evidence.EvidenceTests.test_compatible_python_precision_and_historical_policy \
            test_skill_evidence.EvidenceTests.test_policy_runtime_contradictions \
            test_skill_evidence.EvidenceTests.test_missing_runtime_metadata_and_attempt_fallback \
            test_skill_evidence.EvidenceTests.test_inventory_cli_rejects_malformed_frontmatter_without_traceback \
            test_skill_evidence.EvidenceTests.test_inventory_cli_rejects_real_aggregate_without_allocating_output \
            test_skill_evidence.EvidenceTests.test_normalization_optional_members_use_captured_entries \
            test_skill_evidence.EvidenceTests.test_standalone_cli_disables_repository_bytecode_writes \
            test_skill_evidence.EvidenceTests.test_yaml_alias_graph_has_bounded_depth_work
      - name: Verify the frozen attachment through the released validator host
        env:
          PYTHONPATH: .github/scripts:.github/tests
        run: >-
          "$SKILL_REVIEW_CANDIDATE_PYTHON" -B -m unittest
          test_skill_report_reviews.AttachmentTests.test_frozen_current_profile_rejects_changed_checkout_and_replays_on_release_host
      - name: Verify retained 0.8.0 offline admission when qualifying 0.9.0
        if: inputs.candidate-next
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-current
          "$RUNNER_TEMP/current-evaluator/.venv/bin/python" -B .github/scripts/qualify_current_evaluator.py --output "$RUNNER_TEMP/retained-080-controls"
      - name: Install the frozen opt-in evaluator and selected scanners
        run: |
          if [ "$CANDIDATE_SETUP_KIND" = candidate-next ]; then
            bash .github/scripts/setup-skillevaluator.sh quality-next
          else
            bash .github/scripts/setup-skillevaluator.sh candidate-current
          fi
      - name: Qualify the standard judge HTTP contract without credentials
        if: inputs.candidate-next
        run: '"$SKILL_QUALIFICATION_PYTHON" -B .github/scripts/qualify_standard_judges.py qualify --output "$RUNNER_TEMP/standard-judge-090"'
      - name: Retain local-responder diagnostics and consolidated report
        if: inputs.candidate-next
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standard-judge-090-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/standard-judge-090/reporting/
            ${{ runner.temp }}/standard-judge-090/qualification.json
            ${{ runner.temp }}/standard-judge-090/requests.json
          retention-days: 30
          if-no-files-found: error
      - name: Install the opt-in judge accounting successor
        if: inputs.candidate-next
        run: bash .github/scripts/setup-skillevaluator.sh candidate-accounting
      - name: Qualify physical judge accounting without credentials
        if: inputs.candidate-next
        run: '"$SKILL_ACCOUNTING_PYTHON" -B .github/scripts/qualify_standard_judges.py qualify --accounting --output "$RUNNER_TEMP/standard-judge-accounting"'
      - name: Retain the accounting report and bounded handoff
        if: inputs.candidate-next
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standard-judge-accounting-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/standard-judge-accounting/reporting/
            ${{ runner.temp }}/standard-judge-accounting/qualification.json
            ${{ runner.temp }}/standard-judge-accounting/requests.json
          retention-days: 30
          if-no-files-found: error
      - name: Assess static blockers and qualify offline consumers
        if: inputs.candidate-next
        env:
          EVALUATOR_ADOPTION_CONTROLS: '1'
        run: |
          scanner_scripts=$(python3 -B .github/scripts/static_quality_ci.py tools)
          "$SKILL_QUALIFICATION_PYTHON" -B "$scanner_scripts/qualify_scanners.py" \
            --workspace "$GITHUB_WORKSPACE" --tools "$SKILL_QUALITY_TOOLS" \
            --output "$RUNNER_TEMP/adoption-scanner-controls"
          EVALUATOR_ADOPTION_SCAN_OUTPUT="$RUNNER_TEMP/adoption-scanner-controls" \
            "$SKILL_QUALIFICATION_PYTHON" -B -m unittest discover -s .github/tests -p test_evaluator_adoption.py -v
      - name: Retain static adoption controls
        if: always() && inputs.candidate-next
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluator-adoption-scanner-controls-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adoption-scanner-controls/
          if-no-files-found: error
          retention-days: 30
      - name: Install verified Compose for credential-free native execution
        run: bash .github/scripts/setup-compose.sh
      - name: Qualify collection, interpretation and reporting without inference
        run: '"$SKILL_QUALIFICATION_PYTHON" -B .github/scripts/qualify_current_evaluator.py --output "$RUNNER_TEMP/current-report" --native --cohorts-only'
      - name: Retain consolidated fixture report and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-cohort-report-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/current-report/report.html
            ${{ runner.temp }}/current-report/public/
            ${{ runner.temp }}/current-report/analysis.json
            ${{ runner.temp }}/current-report/metadata.json
            ${{ runner.temp }}/current-report/result.json
            ${{ runner.temp }}/current-report/replay-controls.json
            ${{ runner.temp }}/current-report/scoring-policy.json
            ${{ runner.temp }}/current-report/diagnostics.txt
            ${{ runner.temp }}/current-report/native-stages.json
            ${{ runner.temp }}/current-report/*-command-stages.json
            ${{ runner.temp }}/current-report/native-gh-lifecycle.json
            ${{ runner.temp }}/current-report/native-gh-oracle/
            ${{ runner.temp }}/current-report/native-pester/
            ${{ runner.temp }}/current-report/*-diagnostics.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove task-owned Compose plugin
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup

  native-gh:
    if: ${{ !inputs.startup-only && !inputs.benchmark-121-fixtures && !inputs.benchmark-121-codex && !inputs.benchmark-121-podman && !inputs.benchmark-121-launcher }}
    name: Candidate gh lifecycle (${{ matrix.arm }}, ${{ matrix.shard }}/3, no inference)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [with_skill, without_skill]
        shard: [1, 2, 3]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      GH_ARM: ${{ matrix.arm }}
      GH_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install the frozen candidate and verified Compose
        run: |
          bash .github/scripts/setup-skillevaluator.sh "$CANDIDATE_SETUP_KIND"
          bash .github/scripts/setup-compose.sh
      - name: Run the existing fixed gh lifecycle shard
        run: |
          "$SKILL_QUALIFICATION_PYTHON" -I -B -c 'import os,sys; sys.path.insert(0,".github/scripts"); from gh_initializer_validation import main; main(os.environ["RUNNER_TEMP"]+"/native-gh.json",os.environ["GH_ARM"],int(os.environ["GH_SHARD"]))'
      - name: Retain bounded native shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-gh-${{ matrix.arm }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-gh.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove task-owned Compose plugin
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup

  report:
    name: Candidate native cohorts and consolidated report (no inference)
    needs: [cohorts, native-gh]
    if: ${{ !cancelled() && !inputs.startup-only && !inputs.benchmark-121-fixtures && !inputs.benchmark-121-codex && !inputs.benchmark-121-podman && !inputs.benchmark-121-launcher }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install the frozen report owner
        run: bash .github/scripts/setup-skillevaluator.sh "$CANDIDATE_SETUP_KIND"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-inputs
      - name: Verify complete native evidence and reproduce the canonical report
        run: '"$SKILL_QUALIFICATION_PYTHON" -B .github/scripts/qualify_current_evaluator.py --native-artifacts "$RUNNER_TEMP/native-inputs" --output "$RUNNER_TEMP/complete-native-report"'
      - name: Consume the same-run standard judge qualification on this fresh runner
        if: inputs.candidate-next
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standard-judge-090-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/standard-judge-090
      - name: Reproduce the standard judge consolidated report without model access
        if: inputs.candidate-next
        run: '"$SKILL_QUALIFICATION_PYTHON" -B .github/scripts/qualify_standard_judges.py reproduce --output "$RUNNER_TEMP/standard-judge-090"'
      - name: Install the exact accounting report owner
        if: inputs.candidate-next
        run: bash .github/scripts/setup-skillevaluator.sh candidate-accounting
      - name: Consume same-run physical judge accounting
        if: inputs.candidate-next
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standard-judge-accounting-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/standard-judge-accounting
      - name: Reproduce the admitted accounting report on this fresh runner
        if: inputs.candidate-next
        run: '"$SKILL_ACCOUNTING_PYTHON" -B .github/scripts/qualify_standard_judges.py reproduce --output "$RUNNER_TEMP/standard-judge-accounting"'
      - name: Explain recovery for incomplete qualification
        if: failure()
        run: echo 'Re-run all jobs of this evaluator run to regenerate every input at the same revision and attempt.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the consolidated report and complete bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-offline-report-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/complete-native-report/
          retention-days: 30
          if-no-files-found: error

  startup:
    name: Matched gh-007 startup only (no agent or grading)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.startup-only && !inputs.benchmark-121-fixtures
      && !inputs.benchmark-121-codex && !inputs.benchmark-121-podman && !inputs.benchmark-121-launcher
      && (inputs.candidate-next || inputs.startup-owner == '1.0.1')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: startup-head
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: startup-head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.startup-owner == '0.9.0'
        with:
          ref: 82cdde086fe4d7fad84f21acc614df2adeca1767
          path: startup-base
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Acquire the unchanged pinned owner and Compose
        if: inputs.startup-owner == '0.9.0'
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-next
          bash .github/scripts/setup-compose.sh
      - name: Run focused startup regressions
        if: inputs.startup-owner == '0.9.0'
        run: 'PYTHONPATH=.github/scripts:.github/tests "$SKILL_NEXT_PYTHON" -B -m unittest test_gh_startup_probe -v'
      - name: Start matched gh-007 environments without agent setup
        if: inputs.startup-owner == '0.9.0'
        run: |
          "$SKILL_NEXT_PYTHON" -I -B -c 'import sys; sys.path.insert(0,".github/scripts"); from gh_initializer_validation import startup_only; startup_only(sys.argv[1],sys.argv[2])' \
            "$RUNNER_TEMP/gh-startup.json" "$GITHUB_WORKSPACE/startup-base"
      - name: Acquire the 1.0.1 release owner and Compose
        if: inputs.startup-owner == '1.0.1'
        run: |
          bash .github/scripts/setup-static-evaluator.sh native-startup
          bash .github/scripts/setup-compose.sh
      - name: Exercise released staging and trusted startup in both arms
        if: inputs.startup-owner == '1.0.1'
        run: |
          PYTHONPATH=.github/scripts:.github/tests "$SKILL_NATIVE_STARTUP_PYTHON" -B -m unittest test_gh_startup_probe -v
          "$SKILL_NATIVE_STARTUP_PYTHON" -B .github/scripts/qualify_gh_startup_101.py "$RUNNER_TEMP/gh-startup.json"
      - name: Verify source integrity
        if: always()
        run: git diff --exit-code
      - name: Remove task-owned Compose plugin
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
      - name: Retain bounded startup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-startup-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gh-startup.json
          retention-days: 90
          if-no-files-found: error

  benchmark-121:
    if: >-
      github.event_name == 'workflow_dispatch'
      && !inputs.benchmark-121-launcher
      && (inputs.benchmark-121-fixtures || inputs.benchmark-121-codex || inputs.benchmark-121-podman)
    name: 1.2.1 benchmark candidate (${{ matrix.suite }}, no inference)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.benchmark-121-podman && '["podman"]' || inputs.benchmark-121-codex && '["codex"]' || '["gh", "pester"]') }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      FIXTURE_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install exact benchmark candidate and Compose
        run: |
          bash .github/scripts/setup-static-evaluator.sh native-benchmark-candidate
          bash .github/scripts/setup-compose.sh
      - name: Install retained benchmark for the scoring comparison
        if: matrix.suite == 'gh'
        run: bash .github/scripts/setup-static-evaluator.sh native-benchmark-101
      - name: Verify the request and scoring contracts
        if: matrix.suite == 'gh'
        run: >-
          "$SKILL_NATIVE_BENCHMARK_CANDIDATE_PYTHON" -B .github/scripts/qualify_benchmark_101.py
          "$RUNNER_TEMP/benchmark-121-requests.json" --baseline-python "$SKILL_NATIVE_BENCHMARK_RETAINED_PYTHON"
      - name: Install the pinned private-review owner for the Pester report control
        if: matrix.suite == 'pester'
        run: bash .github/scripts/setup-static-evaluator.sh review-candidate
      - name: Run native deterministic fixtures
        if: matrix.suite == 'gh' || matrix.suite == 'pester'
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$FIXTURE_SUITE" == gh ]]; then
            fixture_source="$(mktemp -d "$RUNNER_TEMP/benchmark-121-gh-source.XXXXXX")"
            git archive "$GITHUB_SHA" | tar --extract --directory="$fixture_source"
            git -C "$fixture_source" apply "$GITHUB_WORKSPACE/.github/patches/benchmark-101-gh-reporting.patch"
            cd "$fixture_source"
          fi
          "$SKILL_NATIVE_BENCHMARK_CANDIDATE_PYTHON" -B .github/scripts/qualify_benchmark_101.py \
            --native "$FIXTURE_SUITE" "$RUNNER_TEMP/benchmark-121-$FIXTURE_SUITE"
      - name: Run pinned Codex against the non-forwarding loopback fixture
        if: matrix.suite == 'codex'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$SKILL_NATIVE_BENCHMARK_CANDIDATE_PYTHON" -B .github/scripts/qualify_benchmark_codex.py "$RUNNER_TEMP/benchmark-121-codex"
      - name: Run isolated Podman with local agent and verifier responders
        if: matrix.suite == 'podman'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$SKILL_NATIVE_BENCHMARK_CANDIDATE_PYTHON" -B .github/scripts/qualify_benchmark_podman.py \
            --output "$RUNNER_TEMP/benchmark-121-podman" --revision "$GITHUB_SHA"
      - name: Verify offline standard and confirmation publication
        if: ${{ !cancelled() && matrix.suite == 'podman' }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          set -o pipefail
          publication_source="$(mktemp -d "$RUNNER_TEMP/benchmark-121-publication-source.XXXXXX")"
          git archive "$GITHUB_SHA" | tar --extract --directory="$publication_source"
          git -C "$publication_source" apply "$GITHUB_WORKSPACE/.github/patches/benchmark-121-publication.patch"
          "$SKILL_NATIVE_BENCHMARK_CANDIDATE_PYTHON" -B "$publication_source/.github/scripts/qualify_benchmark_publication_101.py" \
            --workspace "$GITHUB_WORKSPACE" "$RUNNER_TEMP/benchmark-121-publication"
      - name: Verify source integrity
        if: always()
        run: git diff --exit-code
      - name: Remove task-owned Compose plugin
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
      - name: Retain bounded qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-121-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/benchmark-121-requests.json
            ${{ runner.temp }}/benchmark-121-gh/command-stages.json
            ${{ runner.temp }}/benchmark-121-gh/command-diagnostics.txt
            ${{ runner.temp }}/benchmark-121-gh/qualification.json
            ${{ runner.temp }}/benchmark-121-gh/cleanup.json
            ${{ runner.temp }}/benchmark-121-pester-command-stages.json
            ${{ runner.temp }}/benchmark-121-pester-command-diagnostics.txt
            ${{ runner.temp }}/benchmark-121-pester/qualification.json
            ${{ runner.temp }}/benchmark-121-pester/cleanup.json
            ${{ runner.temp }}/benchmark-121-podman/qualification.json
            ${{ runner.temp }}/benchmark-121-podman/with/startup.json
            ${{ runner.temp }}/benchmark-121-podman/without/startup.json
            ${{ runner.temp }}/benchmark-121-publication/qualification.json
            ${{ runner.temp }}/benchmark-121-codex/qualification.json
            ${{ runner.temp }}/benchmark-121-codex/with/startup.json
            ${{ runner.temp }}/benchmark-121-codex/without/startup.json
            ${{ runner.temp }}/benchmark-121-codex/interrupted/startup.json
            ${{ runner.temp }}/benchmark-121-codex/with/failure.json
            ${{ runner.temp }}/benchmark-121-codex/without/failure.json
          retention-days: 30
          if-no-files-found: error

  benchmark-121-launcher:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark-121-launcher
    name: Released benchmark launcher qualification (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: podman
            mode: standard
          - suite: gh
            mode: confirmation
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      QUALIFICATION_SKILL: ${{ matrix.suite }}
      QUALIFICATION_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install the pinned released launcher owner
        run: bash .github/scripts/setup-static-evaluator.sh native-benchmark-121
      - name: Verify released execution evidence without inference
        env:
          GRADING_PATCH_CHILD: '1'
          CURRENT_NATIVE_CONTROLS: '1'
          PYTHONPATH: .github/tests
        run: '"$SKILL_NATIVE_BENCHMARK_PYTHON" -B -m unittest test_grading_evidence.GradingEvidenceTests -v'
      - name: Verify the paired launcher through its preflight boundary
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$SKILL_NATIVE_BENCHMARK_PYTHON" -B .github/scripts/qualify_native_benchmark.py \
            "$RUNNER_TEMP/released-benchmark-launcher" "$QUALIFICATION_SKILL" "$QUALIFICATION_MODE" "$GITHUB_SHA"
      - name: Install pinned test-only Docker Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Run Docker preflight and both arms against isolated fixtures
        timeout-minutes: 25
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --signal=INT --kill-after=30s 1200s "$SKILL_NATIVE_BENCHMARK_PYTHON" -B \
            .github/scripts/qualify_native_execution.py "$RUNNER_TEMP/released-benchmark-execution" \
            "$QUALIFICATION_SKILL" "$GITHUB_SHA" --mode "$QUALIFICATION_MODE"
      - name: Remove the task-owned Compose plugin
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
      - name: Verify the checkout remains unchanged
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
      - name: Retain bounded launcher qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-121-launcher-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/released-benchmark-launcher/qualification.json
            ${{ runner.temp }}/released-benchmark-execution/qualification.json
            ${{ runner.temp }}/released-benchmark-execution/failure.json
          if-no-files-found: error
          retention-days: 30
