name: Experimental Direct Mode qualification (no inference)
on:
  push:
    branches: [experiment/direct-mode-qualification]
    paths:
      - investigations/direct-mode-qualification/**
      - .github/workflows/experimental-direct-mode-qualification.yml
permissions:
  contents: read
concurrency:
  group: experimental-direct-mode-qualification
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.5'
          enable-cache: false
      - run: bash .github/scripts/setup-compose.sh
      - name: Actual paired CLI and deterministic oracle
        run: bash investigations/direct-mode-qualification/bootstrap.sh
      - name: Export bounded diagnostic evidence
        id: bounds
        if: always()
        run: python3 investigations/direct-mode-qualification/export.py "$RUNNER_TEMP/direct-qualification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.bounds.outcome == 'success'
        with:
          name: direct-mode-qualification
          path: ${{ runner.temp }}/direct-qualification/public-evidence/
          retention-days: 14
