name: Direct Harbor trial
on:
  push:
    branches: [trial/direct-harbor]
    paths: ['.github/trials/direct-harbor/launch.json']
permissions:
  contents: read
concurrency:
  group: direct-harbor-trial
  cancel-in-progress: false
jobs:
  phase:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      phase: ${{ steps.select.outputs.phase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, '.github/trials/direct-harbor')
          phase = json.load(open('.github/trials/direct-harbor/launch.json'))['phase']
          assert phase in ('handoff', 'report', 'live-pair')
          launch = json.load(open('.github/trials/direct-harbor/launch.json'))
          if phase == 'live-pair':
              from allocation import active
              active()
          else:
              assert launch['scheduling_stopped'] is True and launch['paid_execution_enabled'] is False
          assert launch['paid_attempts_used'] in (4, 5, 6)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('phase=' + phase, file=output)
          PYCODE
  handoff:
    needs: phase
    if: needs.phase.outputs.phase == 'handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Prepare historical handoff environment without credentials
        id: handoff_prepare
        timeout-minutes: 15
        run: python -u .github/trials/direct-harbor/handoff.py prepare "$RUNNER_TEMP/handoff"
      - name: Deterministic good submission
        if: always() && steps.handoff_prepare.outcome == 'success'
        timeout-minutes: 8
        run: python -u .github/trials/direct-harbor/handoff.py good "$RUNNER_TEMP/handoff"
      - name: Checkpoint good metadata before continuing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-good
          path: ${{ runner.temp }}/handoff/public/good/
          retention-days: 30
      - name: Deterministic missing submission
        if: always() && steps.handoff_prepare.outcome == 'success'
        timeout-minutes: 8
        run: python -u .github/trials/direct-harbor/handoff.py missing "$RUNNER_TEMP/handoff"
      - name: Checkpoint missing metadata before continuing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-missing
          path: ${{ runner.temp }}/handoff/public/missing/
          retention-days: 30
      - name: Deterministic rejected submission
        if: always() && steps.handoff_prepare.outcome == 'success'
        timeout-minutes: 8
        run: python -u .github/trials/direct-harbor/handoff.py rejected "$RUNNER_TEMP/handoff"
      - name: Checkpoint rejected metadata before continuing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-rejected
          path: ${{ runner.temp }}/handoff/public/rejected/
          retention-days: 30
      - name: Prepare upgraded offline Codex environment
        id: runtime_prepare
        if: always()
        timeout-minutes: 12
        env:
          TRIAL_DIAGNOSTIC: '1'
        run: python -u .github/trials/direct-harbor/live.py diagnostic-prepare "$RUNNER_TEMP/runtime-check"
      - name: Actual upgraded CLI http refusal probe - nonzero expected
        if: always() && steps.runtime_prepare.outcome == 'success'
        timeout-minutes: 4
        env:
          TRIAL_DIAGNOSTIC: '1'
        run: |
          set +e
          python -u .github/trials/direct-harbor/live.py diagnostic "$RUNNER_TEMP/runtime-check" http
          status=$?
          test "$status" -eq 1
      - name: Actual upgraded CLI idle refusal probe - nonzero expected
        if: always() && steps.runtime_prepare.outcome == 'success'
        timeout-minutes: 4
        env:
          TRIAL_DIAGNOSTIC: '1'
        run: |
          set +e
          python -u .github/trials/direct-harbor/live.py diagnostic "$RUNNER_TEMP/runtime-check" idle
          status=$?
          test "$status" -eq 1
      - name: Verify effective runtime behavior
        if: always() && steps.runtime_prepare.outcome == 'success'
        run: python .github/trials/direct-harbor/verify_diagnostic.py "$RUNNER_TEMP/runtime-check"
      - name: Consolidate the single report including incomplete evidence
        if: always()
        run: python .github/trials/direct-harbor/update_handoff_report.py "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/runtime-check" "$RUNNER_TEMP/trial-report"
      - name: Checkpoint runtime metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-check
          path: ${{ runner.temp }}/runtime-check/public/
          retention-days: 30
      - name: Downloadable single report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: ${{ runner.temp }}/trial-report/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  live:
    needs: phase
    if: needs.phase.outputs.phase == 'live-pair' && github.run_attempt == 1
    environment: skill-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Validate this single-use allocation
        run: python .github/trials/direct-harbor/allocation.py validate
      - name: Prepare both arms and check external boundary without credentials
        id: preflight
        timeout-minutes: 25
        run: python -u .github/trials/direct-harbor/live.py prepare "$RUNNER_TEMP/live-pair"
      - name: Checkpoint external boundary before inference
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-preflight
          path: ${{ runner.temp }}/live-pair/public/
          retention-days: 30
          if-no-files-found: error
      - name: Reserve campaign attempt five without credentials
        id: reserve_current
        run: python .github/trials/direct-harbor/allocation.py reserve "$RUNNER_TEMP/live-pair" current
      - name: Durable current reservation before credentialed launch
        id: current_reservation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-attempt-5
          path: ${{ runner.temp }}/live-pair/public/allocation/attempt-5.json
          retention-days: 30
          if-no-files-found: error
      - name: Current skill - one actual Codex attempt
        id: current
        if: steps.current_reservation.outcome == 'success'
        timeout-minutes: 18
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -u .github/trials/direct-harbor/live.py current "$RUNNER_TEMP/live-pair"
      - name: Checkpoint current attempt before absent arm
        id: current_checkpoint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-current
          path: ${{ runner.temp }}/live-pair/public/current/
          retention-days: 30
          if-no-files-found: warn
      - name: Gate and reserve campaign attempt six without credentials
        id: reserve_absent
        if: steps.current.outcome == 'success' && steps.current_checkpoint.outcome == 'success'
        run: python .github/trials/direct-harbor/allocation.py reserve "$RUNNER_TEMP/live-pair" absent
      - name: Durable absent reservation before credentialed launch
        id: absent_reservation
        if: steps.reserve_absent.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-attempt-6
          path: ${{ runner.temp }}/live-pair/public/allocation/attempt-6.json
          retention-days: 30
          if-no-files-found: error
      - name: Absent skill - one actual Codex attempt
        if: steps.absent_reservation.outcome == 'success'
        timeout-minutes: 18
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -u .github/trials/direct-harbor/live.py absent "$RUNNER_TEMP/live-pair"
      - name: Checkpoint absent attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-absent
          path: ${{ runner.temp }}/live-pair/public/absent/
          retention-days: 30
          if-no-files-found: warn
      - name: Close allocation and checkpoint consumed reservations
        if: always()
        run: python .github/trials/direct-harbor/allocation.py close "$RUNNER_TEMP/live-pair"
      - name: Preserve allocation state on all outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-closure
          path: ${{ runner.temp }}/live-pair/public/allocation/
          retention-days: 30
          if-no-files-found: error
      - name: Consolidate the single report
        if: always()
        run: python .github/trials/direct-harbor/update_live_report.py "$RUNNER_TEMP/live-pair" "$RUNNER_TEMP/trial-report"
      - name: Downloadable single report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: ${{ runner.temp }}/trial-report/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  report:
    name: Report packaging only
    needs: phase
    if: needs.phase.outputs.phase == 'report'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate retained report inputs
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path('.github/trials/direct-harbor/results')
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          data = json.loads((root / 'results.json').read_text())
          assert data['campaign'] == 'direct-harbor-20261104'
          assert '<title>Direct Harbor recovery trial</title>' in (root / 'report.html').read_text()
          assert (root / 'workflow-evidence.txt').is_file()
          print('Report files parse. This does not qualify native execution.')
          PYCODE
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: .github/trials/direct-harbor/results/
          retention-days: 30
          if-no-files-found: error
