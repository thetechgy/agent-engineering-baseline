name: Direct Harbor trial
on:
  push:
    branches: [trial/direct-harbor]
    paths: ['.github/trials/direct-harbor/launch.json']
permissions:
  contents: read
concurrency:
  group: direct-harbor-trial
  cancel-in-progress: false
jobs:
  phase:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      phase: ${{ steps.select.outputs.phase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        run: |
          python3 - <<'PYCODE'
          import json, os
          phase = json.load(open('.github/trials/direct-harbor/launch.json'))['phase']
          assert phase in ('recovery-controls', 'report')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('phase=' + phase, file=output)
          PYCODE
  recovery:
    needs: phase
    if: needs.phase.outputs.phase == 'recovery-controls'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p test_projection.py -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Known-good native control
        id: good
        timeout-minutes: 25
        run: python -u .github/trials/direct-harbor/run.py good "$RUNNER_TEMP/recovery-good"
      - name: Checkpoint known-good evidence before next control
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-good
          path: |
            ${{ runner.temp }}/recovery-good/control.json
            ${{ runner.temp }}/recovery-good/manifest.json
            ${{ runner.temp }}/recovery-good/jobs/
          retention-days: 30
          if-no-files-found: error
      - name: Known-weak native control
        if: steps.good.outcome == 'success'
        timeout-minutes: 10
        run: python -u .github/trials/direct-harbor/run.py weak "$RUNNER_TEMP/recovery-weak"
      - name: Checkpoint known-weak evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-weak
          path: |
            ${{ runner.temp }}/recovery-weak/control.json
            ${{ runner.temp }}/recovery-weak/manifest.json
            ${{ runner.temp }}/recovery-weak/jobs/
          retention-days: 30
          if-no-files-found: warn
      - name: Probe native Codex sandbox without credentials
        id: sandbox
        if: always()
        timeout-minutes: 2
        run: python -u .github/trials/direct-harbor/check_sandbox.py "$RUNNER_TEMP/recovery-sandbox"
      - name: Probe built-in Landlock compatibility without credentials
        if: always() && steps.sandbox.outcome == 'failure'
        timeout-minutes: 2
        run: python -u .github/trials/direct-harbor/check_sandbox.py "$RUNNER_TEMP/recovery-sandbox/legacy-landlock" legacy-landlock
      - name: Checkpoint sandbox evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-sandbox
          path: ${{ runner.temp }}/recovery-sandbox/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  report:
    name: Report packaging only
    needs: phase
    if: needs.phase.outputs.phase == 'report'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate retained report inputs
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path('.github/trials/direct-harbor/results')
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          data = json.loads((root / 'results.json').read_text())
          assert data['campaign'] == 'direct-harbor-20261104'
          assert '<title>Direct Harbor recovery trial</title>' in (root / 'report.html').read_text()
          assert (root / 'workflow-evidence.txt').is_file()
          print('Report files parse. This does not qualify native execution.')
          PYCODE
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: .github/trials/direct-harbor/results/
          retention-days: 30
          if-no-files-found: error
