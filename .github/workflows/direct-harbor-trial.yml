name: Direct Harbor trial
on:
  push:
    branches: [trial/direct-harbor]
    paths: ['.github/trials/direct-harbor/launch.json']
permissions:
  contents: read
concurrency:
  group: direct-harbor-trial
  cancel-in-progress: false
jobs:
  phase:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      phase: ${{ steps.select.outputs.phase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        run: |
          python3 - <<'PYCODE'
          import json, os
          phase = json.load(open('.github/trials/direct-harbor/launch.json'))['phase']
          assert phase in ('diagnostic-reproduce', 'diagnostic-verify', 'report')
          assert json.load(open('.github/trials/direct-harbor/launch.json'))['scheduling_stopped'] is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('phase=' + phase, file=output)
          PYCODE
  diagnostic:
    needs: phase
    if: startsWith(needs.phase.outputs.phase, 'diagnostic-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      TRIAL_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p test_projection.py -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Prepare pinned offline agent
        id: prepare
        timeout-minutes: 12
        run: python -u .github/trials/direct-harbor/live.py diagnostic-prepare "$RUNNER_TEMP/launch-diagnostic"
      - name: Checkpoint offline boundary before launch
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-preflight
          path: ${{ runner.temp }}/launch-diagnostic/public/
          retention-days: 30
      - name: Reproduce historical stock launch - expected nonzero
        timeout-minutes: 4
        run: python -u .github/trials/direct-harbor/live.py diagnostic "$RUNNER_TEMP/launch-diagnostic" historical
      - name: Checkpoint historical failure before corrected probes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-historical
          path: ${{ runner.temp }}/launch-diagnostic/public/historical/
          retention-days: 30
      - name: Corrected provider HTTP refusal - expected nonzero
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 4
        run: python -u .github/trials/direct-harbor/live.py diagnostic "$RUNNER_TEMP/launch-diagnostic" http
      - name: Corrected provider silent stream - expected nonzero
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 4
        run: python -u .github/trials/direct-harbor/live.py diagnostic "$RUNNER_TEMP/launch-diagnostic" idle
      - name: Verify observed startup, no retries and 60-second stream timeout
        if: always() && steps.prepare.outcome == 'success'
        run: python .github/trials/direct-harbor/verify_diagnostic.py "$RUNNER_TEMP/launch-diagnostic"
      - name: Recover sanitized launch diagnostics including failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-diagnostics
          path: ${{ runner.temp }}/launch-diagnostic/public/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  report:
    name: Report packaging only
    needs: phase
    if: needs.phase.outputs.phase == 'report'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate retained report inputs
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path('.github/trials/direct-harbor/results')
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          data = json.loads((root / 'results.json').read_text())
          assert data['campaign'] == 'direct-harbor-20261104'
          assert '<title>Direct Harbor recovery trial</title>' in (root / 'report.html').read_text()
          assert (root / 'workflow-evidence.txt').is_file()
          print('Report files parse. This does not qualify native execution.')
          PYCODE
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: .github/trials/direct-harbor/results/
          retention-days: 30
          if-no-files-found: error
