name: Direct Harbor trial
on:
  push:
    branches: [trial/direct-harbor]
    paths: ['.github/trials/direct-harbor/launch.json']
permissions:
  contents: read
concurrency:
  group: direct-harbor-trial
  cancel-in-progress: false
jobs:
  phase:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      phase: ${{ steps.select.outputs.phase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, '.github/trials/direct-harbor')
          phase = json.load(open('.github/trials/direct-harbor/launch.json'))['phase']
          assert phase in ('handoff', 'report', 'live-pair', 'admission', 'retention', 'preparation', 'retrospective', 'reader', 'boolean')
          launch = json.load(open('.github/trials/direct-harbor/launch.json'))
          if phase == 'live-pair':
              from allocation import active
              active()
          else:
              assert launch['scheduling_stopped'] is True and launch['paid_execution_enabled'] is False
          if phase == 'preparation':
              preparation = json.load(open('.github/trials/direct-harbor/preparation.json'))
              from prepared import preparation_window
              preparation_window()
              assert preparation['prepared_source'] is None
          assert launch['paid_attempts_used'] in (4, 5, 6, 7, 8, 9)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('phase=' + phase, file=output)
          PYCODE
  reader:
    name: Credential-free real Docker content reader
    needs: phase
    if: needs.phase.outputs.phase == 'reader' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the preparation window
        run: python3 -c "import sys; sys.path.insert(0,'.github/trials/direct-harbor'); from prepared import preparation_window; preparation_window()"
      - name: Focused bounded-reader checks
        run: python3 -m unittest discover -s .github/trials/direct-harbor -p test_image_contents.py -v
      - name: Real Docker read-only content and failure controls
        run: python3 -u .github/trials/direct-harbor/qualify_reader.py "$RUNNER_TEMP/content-reader"
      - name: Preserve reader outcomes and unconditional Docker diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-evidence
          path: ${{ runner.temp }}/content-reader/public/
          retention-days: 30
          if-no-files-found: error
      - if: always()
        run: git diff --exit-code
  handoff:
    needs: phase
    if: needs.phase.outputs.phase == 'handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Prepare historical handoff environment without credentials
        id: handoff_prepare
        timeout-minutes: 15
        run: python -u .github/trials/direct-harbor/handoff.py prepare "$RUNNER_TEMP/handoff"
      - name: Deterministic good submission
        if: always() && steps.handoff_prepare.outcome == 'success'
        timeout-minutes: 8
        run: python -u .github/trials/direct-harbor/handoff.py good "$RUNNER_TEMP/handoff"
      - name: Checkpoint good metadata before continuing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-good
          path: ${{ runner.temp }}/handoff/public/good/
          retention-days: 30
      - name: Deterministic missing submission
        if: always() && steps.handoff_prepare.outcome == 'success'
        timeout-minutes: 8
        run: python -u .github/trials/direct-harbor/handoff.py missing "$RUNNER_TEMP/handoff"
      - name: Checkpoint missing metadata before continuing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-missing
          path: ${{ runner.temp }}/handoff/public/missing/
          retention-days: 30
      - name: Deterministic rejected submission
        if: always() && steps.handoff_prepare.outcome == 'success'
        timeout-minutes: 8
        run: python -u .github/trials/direct-harbor/handoff.py rejected "$RUNNER_TEMP/handoff"
      - name: Checkpoint rejected metadata before continuing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-rejected
          path: ${{ runner.temp }}/handoff/public/rejected/
          retention-days: 30
      - name: Prepare upgraded offline Codex environment
        id: runtime_prepare
        if: always()
        timeout-minutes: 12
        env:
          TRIAL_DIAGNOSTIC: '1'
        run: python -u .github/trials/direct-harbor/live.py diagnostic-prepare "$RUNNER_TEMP/runtime-check"
      - name: Actual upgraded CLI http refusal probe - nonzero expected
        if: always() && steps.runtime_prepare.outcome == 'success'
        timeout-minutes: 4
        env:
          TRIAL_DIAGNOSTIC: '1'
        run: |
          set +e
          python -u .github/trials/direct-harbor/live.py diagnostic "$RUNNER_TEMP/runtime-check" http
          status=$?
          test "$status" -eq 1
      - name: Actual upgraded CLI idle refusal probe - nonzero expected
        if: always() && steps.runtime_prepare.outcome == 'success'
        timeout-minutes: 4
        env:
          TRIAL_DIAGNOSTIC: '1'
        run: |
          set +e
          python -u .github/trials/direct-harbor/live.py diagnostic "$RUNNER_TEMP/runtime-check" idle
          status=$?
          test "$status" -eq 1
      - name: Verify effective runtime behavior
        if: always() && steps.runtime_prepare.outcome == 'success'
        run: python .github/trials/direct-harbor/verify_diagnostic.py "$RUNNER_TEMP/runtime-check"
      - name: Consolidate the single report including incomplete evidence
        if: always()
        run: python .github/trials/direct-harbor/update_handoff_report.py "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/runtime-check" "$RUNNER_TEMP/trial-report"
      - name: Checkpoint runtime metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-check
          path: ${{ runner.temp }}/runtime-check/public/
          retention-days: 30
      - name: Downloadable single report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: ${{ runner.temp }}/trial-report/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  admission:
    needs: phase
    if: needs.phase.outputs.phase == 'admission'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Validate the fixed offline Docker verifier and report propagation
        timeout-minutes: 18
        run: python -u .github/trials/direct-harbor/admission_validation.py "$RUNNER_TEMP/admission-validation" "$RUNNER_TEMP/trial-report"
      - name: Preserve diagnostic evidence on all outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-validation
          path: ${{ runner.temp }}/admission-validation/public/
          retention-days: 30
          if-no-files-found: error
      - name: Downloadable single report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: ${{ runner.temp }}/trial-report/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
  retrospective:
    name: Credential-free admission policy qualification and replay
    permissions:
      contents: read
      actions: read
    needs: phase
    if: contains(fromJSON('["retrospective","boolean"]'), needs.phase.outputs.phase) && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Qualify policy and replay exact retained bytes inside the isolated verifier
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python -c 'import json; print(json.load(open(".github/trials/direct-harbor/launch.json"))["phase"])')" = boolean ]; then
            python -u .github/trials/direct-harbor/boolean_replay.py "$RUNNER_TEMP/retrospective" "$RUNNER_TEMP/trial-report"
          else
            python -u .github/trials/direct-harbor/retrospective.py "$RUNNER_TEMP/retrospective" "$RUNNER_TEMP/trial-report"
          fi
      - name: Preserve diagnostic evidence on all outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrospective-evidence
          path: ${{ runner.temp }}/retrospective/public/
          retention-days: 30
          if-no-files-found: error
      - name: Retain distinct corrected verifier image and provenance
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.phase.outputs.phase == 'boolean' && 'corrected-assertion-verifier' || 'corrected-template-verifier' }}
          path: ${{ runner.temp }}/retrospective/corrected-verifier/
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
      - name: Downloadable single report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: ${{ runner.temp }}/trial-report/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
  retention:
    name: Credential-free exact-byte retention fixture
    needs: phase
    if: needs.phase.outputs.phase == 'retention'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Focused publication boundary checks without credentials
        run: python3 -m unittest discover -s .github/trials/direct-harbor -p test_retention.py -v
      - name: Stage synthetic bytes through the publication check
        run: python3 .github/trials/direct-harbor/retention.py fixture "$RUNNER_TEMP/retention-fixture"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retention-fixture-bytes
          path: ${{ runner.temp }}/retention-fixture/bundle/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: retention-fixture-bytes
          path: ${{ runner.temp }}/retention-download/
      - name: Verify downloaded bytes and identity without executing the file
        run: python3 .github/trials/direct-harbor/retention.py fixture-verify "$RUNNER_TEMP/retention-fixture" "$RUNNER_TEMP/retention-download"
      - name: Preserve fixture metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retention-fixture-proof
          path: ${{ runner.temp }}/retention-fixture/proof.json
          retention-days: 30
          if-no-files-found: error
      - run: git diff --exit-code
  prepare:
    name: Credential-free pinned preparation and transfer check
    needs: phase
    if: (needs.phase.outputs.phase == 'preparation' || needs.phase.outputs.phase == 'live-pair') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 || steps.reuse.outputs.manifest_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Restore and validate exact retained snapshot indexes
        if: needs.phase.outputs.phase == 'preparation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/trials/direct-harbor/prepared.py dependency "$RUNNER_TEMP/dependencies"
      - name: Retain verified dependencies for reuse
        if: needs.phase.outputs.phase == 'preparation'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-dependencies
          path: ${{ runner.temp }}/dependencies/snapshot-20261103.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Reuse an explicitly selected qualified producer for a later allocation
        id: reuse
        if: needs.phase.outputs.phase == 'live-pair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/trials/direct-harbor/prepared.py reuse "$RUNNER_TEMP/prepared-bundle"
      - name: Restore and check qualified images before environment approval
        if: needs.phase.outputs.phase == 'live-pair'
        timeout-minutes: 8
        env:
          PREPARED_MANIFEST_SHA256: ${{ steps.reuse.outputs.manifest_sha256 }}
        run: |
          python -u .github/trials/direct-harbor/prepared.py restore "$RUNNER_TEMP/prepared-bundle" "$RUNNER_TEMP/preparation" "$PREPARED_MANIFEST_SHA256"
          python -u .github/trials/direct-harbor/prepared.py preflight "$RUNNER_TEMP/preparation"
      - name: Prepare matching documentation layers and reuse the corrected verifier
        id: preflight
        if: needs.phase.outputs.phase == 'preparation'
        env:
          TRIAL_SNAPSHOT_BUNDLE: ${{ runner.temp }}/dependencies/indexes
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
        run: python -u .github/trials/direct-harbor/prepared.py matching "$RUNNER_TEMP/preparation" "$RUNNER_TEMP/matching-sources"
      - name: Save prepared images and immutable task inputs
        id: bundle
        if: needs.phase.outputs.phase == 'preparation'
        timeout-minutes: 6
        run: python -u .github/trials/direct-harbor/prepared.py export "$RUNNER_TEMP/preparation" "$RUNNER_TEMP/prepared-bundle"
      - name: Retain prepared images and protected task inputs for seven days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-images
          path: ${{ runner.temp }}/prepared-bundle/
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
      - name: Verify archive manifests before fresh runner qualification
        env:
          PREPARED_MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest_sha256 || steps.reuse.outputs.manifest_sha256 }}
        run: python .github/trials/direct-harbor/prepared.py verify "$RUNNER_TEMP/prepared-bundle" "$PREPARED_MANIFEST_SHA256" "$RUNNER_TEMP/preparation/public/prepared-download.json"
      - name: Preserve credential-free preparation metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-evidence
          path: ${{ runner.temp }}/preparation/public/
          retention-days: 30
          if-no-files-found: warn
      - name: Close unused allocation if preparation fails
        if: failure() && (needs.phase.outputs.phase == 'live-pair' || needs.phase.outputs.phase == 'preparation')
        run: python .github/trials/direct-harbor/allocation.py close "$RUNNER_TEMP/preparation"
      - name: Preserve preparation failure closure
        if: failure() && (needs.phase.outputs.phase == 'live-pair' || needs.phase.outputs.phase == 'preparation')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preparation-closure
          path: ${{ runner.temp }}/preparation/public/allocation/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  qualify:
    name: Fresh runner restore and native controls
    needs: [phase, prepare]
    if: needs.phase.outputs.phase == 'preparation' && needs.prepare.result == 'success' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Download retained images into a fresh runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-images
          path: ${{ runner.temp }}/prepared-download/
      - name: Validate, load, relocate and exercise without rebuilding
        env:
          PREPARED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: python -u .github/trials/direct-harbor/prepared.py qualify "$RUNNER_TEMP/prepared-download" "$RUNNER_TEMP/fresh-restored" "$PREPARED_MANIFEST_SHA256"
      - name: Preserve fresh runner proof and recoverable diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-runner-evidence
          path: |
            ${{ runner.temp }}/fresh-restored/public/
            ${{ runner.temp }}/fresh-restored/fresh-controls/public/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  live:
    needs: [phase, prepare]
    if: needs.phase.outputs.phase == 'live-pair' && needs.prepare.result == 'success' && github.run_attempt == 1
    environment: skill-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire unchanged Harbor release and lock
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/harbor"
          git init --quiet "$source"
          git -C "$source" fetch --quiet --depth=1 https://github.com/harbor-framework/harbor.git fdba28fc411e47e8765420a1a063b4918fce3def
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = fdba28fc411e47e8765420a1a063b4918fce3def
          uv sync --project "$source" --python 3.13.15 --managed-python --frozen --no-dev
          uv pip check --python "$source/.venv/bin/python"
          git -C "$source" diff --exit-code
          echo "$source/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify projection and launch extension
        run: python -m unittest discover -s .github/trials/direct-harbor -p 'test_*.py' -q
      - name: Install reviewed Compose
        run: bash .github/scripts/setup-compose.sh
      - name: Validate this single-use allocation
        run: python .github/trials/direct-harbor/allocation.py validate
      - name: Download only this run's prepared images and inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-images
          path: ${{ runner.temp }}/prepared-download/
      - name: Download this run's credential-free verification proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-evidence
          path: ${{ runner.temp }}/preparation-evidence/
      - name: Verify and restore prepared images without rebuilding
        id: restored
        timeout-minutes: 7
        env:
          PREPARED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: python -u .github/trials/direct-harbor/prepared.py restore "$RUNNER_TEMP/prepared-download" "$RUNNER_TEMP/live-pair" "$PREPARED_MANIFEST_SHA256" "$RUNNER_TEMP/preparation-evidence/prepared-download.json"
      - name: Check restored runtime before any reservation or credential injection
        timeout-minutes: 4
        run: python -u .github/trials/direct-harbor/prepared.py preflight "$RUNNER_TEMP/live-pair"
      - name: Checkpoint prepared image and task identity before inference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-preflight
          path: ${{ runner.temp }}/live-pair/public/
          retention-days: 30
          if-no-files-found: error
      - name: Reserve current campaign attempt without credentials
        id: reserve_current
        run: python .github/trials/direct-harbor/allocation.py reserve "$RUNNER_TEMP/live-pair" current
      - name: Durable current reservation before credentialed launch
        id: current_reservation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-v2-qualified-attempt-8
          path: ${{ runner.temp }}/live-pair/public/allocation/attempt-8.json
          retention-days: 30
          if-no-files-found: error
      - name: Current skill - one actual Codex attempt
        id: current
        if: steps.current_reservation.outcome == 'success'
        timeout-minutes: 18
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -u .github/trials/direct-harbor/live.py current "$RUNNER_TEMP/live-pair"
      - name: Retain exact authorized current submission
        id: current_submission
        if: always() && steps.current.outputs.retention_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submission-sol-high-v2-qualified-20261106-current
          path: ${{ runner.temp }}/live-pair/submissions/current/
          retention-days: 30
          if-no-files-found: error
      - name: Download retained current bytes for verification
        id: current_download
        if: always() && steps.current_submission.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission-sol-high-v2-qualified-20261106-current
          path: ${{ runner.temp }}/submission-download/current/
      - name: Bind retained current artifact to its reservation and hashes
        id: current_publication
        if: always() && steps.current_download.outcome == 'success'
        env:
          SUBMISSION_ARTIFACT_ID: ${{ steps.current_submission.outputs.artifact-id }}
        run: python .github/trials/direct-harbor/retention.py publish "$RUNNER_TEMP/live-pair" current "$RUNNER_TEMP/submission-download/current" "$SUBMISSION_ARTIFACT_ID"
      - name: Checkpoint current attempt before absent arm
        id: current_checkpoint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-current
          path: ${{ runner.temp }}/live-pair/public/current/
          retention-days: 30
          if-no-files-found: warn
      - name: Gate and reserve absent campaign attempt without credentials
        id: reserve_absent
        if: steps.current.outcome == 'success' && steps.current_checkpoint.outcome == 'success'
        run: python .github/trials/direct-harbor/allocation.py reserve "$RUNNER_TEMP/live-pair" absent
      - name: Durable absent reservation before credentialed launch
        id: absent_reservation
        if: steps.reserve_absent.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-v2-qualified-attempt-9
          path: ${{ runner.temp }}/live-pair/public/allocation/attempt-9.json
          retention-days: 30
          if-no-files-found: error
      - name: Absent skill - one actual Codex attempt
        id: absent
        if: steps.absent_reservation.outcome == 'success'
        timeout-minutes: 18
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -u .github/trials/direct-harbor/live.py absent "$RUNNER_TEMP/live-pair"
      - name: Retain exact authorized absent submission
        id: absent_submission
        if: always() && steps.absent.outputs.retention_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submission-sol-high-v2-qualified-20261106-absent
          path: ${{ runner.temp }}/live-pair/submissions/absent/
          retention-days: 30
          if-no-files-found: error
      - name: Download retained absent bytes for verification
        id: absent_download
        if: always() && steps.absent_submission.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission-sol-high-v2-qualified-20261106-absent
          path: ${{ runner.temp }}/submission-download/absent/
      - name: Bind retained absent artifact to its reservation and hashes
        id: absent_publication
        if: always() && steps.absent_download.outcome == 'success'
        env:
          SUBMISSION_ARTIFACT_ID: ${{ steps.absent_submission.outputs.artifact-id }}
        run: python .github/trials/direct-harbor/retention.py publish "$RUNNER_TEMP/live-pair" absent "$RUNNER_TEMP/submission-download/absent" "$SUBMISSION_ARTIFACT_ID"
      - name: Checkpoint absent attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-absent
          path: ${{ runner.temp }}/live-pair/public/absent/
          retention-days: 30
          if-no-files-found: warn
      - name: Close allocation and checkpoint consumed reservations
        if: always()
        run: python .github/trials/direct-harbor/allocation.py close "$RUNNER_TEMP/live-pair"
      - name: Preserve allocation state on all outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-closure
          path: ${{ runner.temp }}/live-pair/public/allocation/
          retention-days: 30
          if-no-files-found: error
      - name: Consolidate the single report
        if: always()
        run: python .github/trials/direct-harbor/update_live_report.py "$RUNNER_TEMP/live-pair" "$RUNNER_TEMP/trial-report"
      - name: Downloadable single report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: ${{ runner.temp }}/trial-report/
          retention-days: 30
          if-no-files-found: error
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Remove test-only Compose
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
  report:
    name: Report packaging only
    needs: phase
    if: needs.phase.outputs.phase == 'report'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate retained report inputs
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path('.github/trials/direct-harbor/results')
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          data = json.loads((root / 'results.json').read_text())
          assert data['campaign'] == 'direct-harbor-20261104'
          assert '<title>Direct Harbor recovery trial</title>' in (root / 'report.html').read_text()
          assert (root / 'workflow-evidence.txt').is_file()
          print('Report files parse. This does not qualify native execution.')
          PYCODE
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-harbor-trial-report
          path: .github/trials/direct-harbor/results/
          retention-days: 30
          if-no-files-found: error
