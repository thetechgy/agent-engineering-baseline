name: Update reviewed APM baseline

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-reviewed-apm-baseline
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PowerShell validation tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Install Markdown linter
        run: pipx install rumdl==0.2.34

      - name: Refresh reviewed inputs and generated outputs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Update-Baseline.ps1

      - name: Install refreshed APM CLI
        run: |
          version="$(awk '$1 == "version:" { print $2; exit }' apm-cli.lock.yml)"
          tag="$(awk '$1 == "tag:" { print $2; exit }' apm-cli.lock.yml)"
          archive_name="$(awk '
            $0 == "  linux-x86_64:" { found=1; next }
            found && $1 == "name:" { print $2; exit }
          ' apm-cli.lock.yml)"
          archive_hash="$(awk '
            $0 == "  linux-x86_64:" { found=1; next }
            found && $1 == "sha256:" { print $2; exit }
          ' apm-cli.lock.yml)"
          archive="$RUNNER_TEMP/$archive_name"
          install_dir="$RUNNER_TEMP/apm-$version"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/microsoft/apm/releases/download/$tag/$archive_name"
          echo "$archive_hash  $archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No reviewed APM baseline update is available.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate candidate update
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Invoke-Validation.ps1

      - name: Create candidate patch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/baseline.patch"

      - name: Upload candidate patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-apm-baseline-patch
          path: ${{ runner.temp }}/baseline.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-apm-baseline-patch
          path: ${{ runner.temp }}

      - name: Apply data-only candidate patch
        run: |
          git apply --check "$RUNNER_TEMP/baseline.patch"
          git apply --binary --index "$RUNNER_TEMP/baseline.patch"

      - name: Create or update review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch='automation/apm-baseline-update'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git commit -m 'chore(apm): refresh reviewed baseline'
          gh auth setup-git
          git push --force-with-lease origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          body_file="$RUNNER_TEMP/apm-update-pr.md"
          approved_version="$(awk '$1 == "version:" { print $2; exit }' apm-cli.lock.yml)"
          printf '%s\n' \
            '## Summary' \
            '' \
            "- reviewed APM CLI candidate: $approved_version" \
            '- refreshes the reviewed APM CLI lock and exact upstream path commits' \
            '- regenerates provenance, mirrored skills, dependency lock, and APM outputs' \
            '- runs the full repository validation suite before publication' \
            '' \
            '## Changed files' \
            '' \
            '```text' > "$body_file"
          git show --stat --format= >> "$body_file"
          printf '%s\n' \
            '```' \
            '' \
            'This pull request is intentionally review-only and will not auto-merge.' >> "$body_file"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title 'chore(apm): refresh reviewed baseline' --body-file "$body_file"
          else
            gh pr create --base main --head "$branch" \
              --title 'chore(apm): refresh reviewed baseline' --body-file "$body_file"
          fi
