name: Update APM baseline

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-apm-baseline
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install reviewed APM CLI
        shell: bash
        run: |
          version="$(head -n 1 .apm-version | tr -d '[:space:]')"
          case "$(uname -m)" in
            x86_64) platform_arch='x86_64' ;;
            arm64|aarch64) platform_arch='arm64' ;;
            *) echo 'Unsupported Linux architecture.' >&2; exit 1 ;;
          esac
          archive="apm-linux-$platform_arch.tar.gz"
          archive_root="apm-linux-$platform_arch"
          member="$archive_root/apm"
          secure_root="$RUNNER_TEMP/apm-secure-install"
          mkdir -p "$secure_root/extract" "$secure_root/mirror/v$version"
          curl --fail --location --silent --show-error --output "$secure_root/install.sh" \
            "https://raw.githubusercontent.com/microsoft/apm/v$version/install.sh"
          curl --fail --location --silent --show-error --output "$secure_root/$archive" \
            "https://github.com/microsoft/apm/releases/download/v$version/$archive"
          verify_checksum() {
            local path=$1 name=$2 expected
            expected="$(
              awk -v name="$name" '
                $2 == name { checksum = $1; count++ }
                END {
                  if (count != 1) exit 1
                  print checksum
                }
              ' .apm-checksums
            )" || {
              printf 'Expected exactly one pinned checksum for %s.\n' "$name" >&2
              return 1
            }
            printf '%s\n' "$expected" | grep -Eq '^[0-9a-f]{64}$'
            printf '%s  %s\n' "$expected" "$path" | sha256sum --check --strict -
          }
          verify_checksum "$secure_root/install.sh" install.sh
          verify_checksum "$secure_root/$archive" "$archive"
          tar -tzf "$secure_root/$archive" | awk -v root="$archive_root" -v member="$member" '
            BEGIN { valid = 1; count = 0 }
            {
              if ($0 == member) count++
              if ($0 != root && index($0, root "/") != 1) valid = 0
              if ($0 ~ /^\// || $0 ~ /(^|\/)\.\.($|\/)/) valid = 0
            }
            END { exit(valid && count == 1 ? 0 : 1) }
          '
          tar -xzf "$secure_root/$archive" -C "$secure_root/extract"
          [ -z "$(find "$secure_root/extract/$archive_root" -type l -print -quit)" ]
          verify_checksum "$secure_root/extract/$member" "$member"
          cp "$secure_root/$archive" "$secure_root/mirror/v$version/$archive"
          verify_checksum "$secure_root/mirror/v$version/$archive" "$archive"
          APM_INSTALL_DIR="$RUNNER_TEMP/apm-bin" \
            APM_RELEASE_BASE_URL="file://$secure_root/mirror" \
            APM_NO_DIRECT_FALLBACK=1 VERSION="v$version" sh "$secure_root/install.sh"
          installed="$RUNNER_TEMP/lib/apm/apm"
          verify_checksum "$installed" "$member"
          "$installed" --version
          dirname "$installed" >> "$GITHUB_PATH"

      - name: Refresh APM CLI version pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(gh api repos/microsoft/apm/releases/latest --jq '.tag_name')"
          latest="${latest#v}"
          printf '%s\n' "$latest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' "$latest" > .apm-version
          candidate_root="$RUNNER_TEMP/apm-candidate"
          mkdir -p "$candidate_root"
          curl --fail --location --silent --show-error --output "$candidate_root/install.sh" \
            "https://raw.githubusercontent.com/microsoft/apm/v$latest/install.sh"
          for archive in \
            apm-linux-arm64.tar.gz \
            apm-linux-x86_64.tar.gz \
            apm-windows-x86_64.zip; do
            curl --fail --location --silent --show-error --output "$candidate_root/$archive" \
              "https://github.com/microsoft/apm/releases/download/v$latest/$archive"
          done
          for platform_arch in arm64 x86_64; do
            archive="apm-linux-$platform_arch.tar.gz"
            archive_root="apm-linux-$platform_arch"
            member="$archive_root/apm"
            tar -tzf "$candidate_root/$archive" | awk -v root="$archive_root" -v member="$member" '
              BEGIN { valid = 1; count = 0 }
              {
                if ($0 == member) count++
                if ($0 != root && index($0, root "/") != 1) valid = 0
                if ($0 ~ /^\// || $0 ~ /(^|\/)\.\.($|\/)/) valid = 0
              }
              END { exit(valid && count == 1 ? 0 : 1) }
            '
            extract_root="$candidate_root/extract-$platform_arch"
            mkdir "$extract_root"
            tar -xzf "$candidate_root/$archive" -C "$extract_root"
            [ -z "$(find "$extract_root/$archive_root" -type l -print -quit)" ]
            [ -f "$extract_root/$member" ]
          done
          unzip -Z1 "$candidate_root/apm-windows-x86_64.zip" | awk '
            BEGIN { valid = 1; count = 0; root = "apm-windows-x86_64"; member = root "/apm.exe" }
            {
              if ($0 == member) count++
              if ($0 != root "/" && index($0, root "/") != 1) valid = 0
              if ($0 ~ /^\// || $0 ~ /(^|\/)\.\.($|\/)/) valid = 0
            }
            END { exit(valid && count == 1 ? 0 : 1) }
          '
          windows_extract="$candidate_root/extract-windows"
          mkdir "$windows_extract"
          unzip -q "$candidate_root/apm-windows-x86_64.zip" -d "$windows_extract"
          [ -z "$(find "$windows_extract/apm-windows-x86_64" -type l -print -quit)" ]
          [ -f "$windows_extract/apm-windows-x86_64/apm.exe" ]
          {
            printf '%s  install.sh\n' "$(sha256sum "$candidate_root/install.sh" | awk '{ print $1 }')"
            printf '%s  apm-linux-arm64.tar.gz\n' \
              "$(sha256sum "$candidate_root/apm-linux-arm64.tar.gz" | awk '{ print $1 }')"
            printf '%s  apm-linux-arm64/apm\n' \
              "$(sha256sum "$candidate_root/extract-arm64/apm-linux-arm64/apm" | awk '{ print $1 }')"
            printf '%s  apm-linux-x86_64.tar.gz\n' \
              "$(sha256sum "$candidate_root/apm-linux-x86_64.tar.gz" | awk '{ print $1 }')"
            printf '%s  apm-linux-x86_64/apm\n' \
              "$(sha256sum "$candidate_root/extract-x86_64/apm-linux-x86_64/apm" | awk '{ print $1 }')"
            printf '%s  apm-windows-x86_64.zip\n' \
              "$(sha256sum "$candidate_root/apm-windows-x86_64.zip" | awk '{ print $1 }')"
            printf '%s  apm-windows-x86_64/apm.exe\n' \
              "$(sha256sum "$windows_extract/apm-windows-x86_64/apm.exe" | awk '{ print $1 }')"
          } > .apm-checksums

      - name: Update APM dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apm update --yes
          apm compile --target codex,copilot --validate
          apm compile --target codex,copilot

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No APM baseline update is available.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install validation tools
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          pipx install rumdl==0.2.34

      - name: Validate candidate update
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stage every non-ignored candidate output before validation so new
          # files cannot remain outside the review patch.
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --cached --check failed.' }
          ./scripts/Invoke-Validation.ps1

      - name: Create candidate patch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/baseline.patch"

      - name: Upload candidate patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-baseline-patch
          path: ${{ runner.temp }}/baseline.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apm-baseline-patch
          path: ${{ runner.temp }}

      - name: Apply data-only candidate patch
        run: |
          git apply --check "$RUNNER_TEMP/baseline.patch"
          git apply --binary --index "$RUNNER_TEMP/baseline.patch"

      - name: Create or update review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch='automation/apm-baseline-update'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git commit -m 'chore(apm): refresh baseline'
          gh auth setup-git
          git push --force-with-lease origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          body_file="$RUNNER_TEMP/apm-update-pr.md"
          pinned_version="$(head -n 1 .apm-version | tr -d '[:space:]')"
          printf '%s\n' \
            '## Summary' \
            '' \
            "- APM CLI candidate: $pinned_version" \
            '- refreshes the APM CLI version pin and reviewed installer/archive/executable hashes' \
            '- re-resolves branch-ref dependencies with `apm update` and rewrites the lockfile' \
            '- regenerates compiled outputs and runs the full repository validation suite' \
            '' \
            '## Required review' \
            '' \
            'Review the pinned upstream commit and every changed installer, archive, and executable hash before merging. Hashes provide integrity evidence; they do not prove benign behavior.' \
            '' \
            '## Changed files' \
            '' \
            '```text' > "$body_file"
          git show --stat --format= >> "$body_file"
          printf '%s\n' \
            '```' \
            '' \
            'This pull request is intentionally review-only and will not auto-merge.' >> "$body_file"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title 'chore(apm): refresh baseline' --body-file "$body_file"
          else
            gh pr create --base main --head "$branch" \
              --title 'chore(apm): refresh baseline' --body-file "$body_file"
          fi
