name: Update APM baseline

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-apm-baseline
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh APM CLI version pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(gh api repos/microsoft/apm/releases/latest --jq '.tag_name')"
          latest="${latest#v}"
          printf '%s\n' "$latest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' "$latest" > .apm-version

      - name: Install pinned APM CLI
        shell: bash
        run: |
          version="$(head -n 1 .apm-version | tr -d '[:space:]')"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/microsoft/apm/v$version/install.sh" |
            VERSION="v$version" sh
          if ! command -v apm >/dev/null 2>&1; then
            # The installer may target a directory missing from this shell's PATH.
            for candidate in "$HOME/.local/bin" /usr/local/bin; do
              if [ -x "$candidate/apm" ]; then
                PATH="$candidate:$PATH"
                break
              fi
            done
          fi
          if ! command -v apm >/dev/null 2>&1; then
            echo 'apm is not on PATH after installation.' >&2
            exit 1
          fi
          dirname "$(command -v apm)" >> "$GITHUB_PATH"
          apm --version

      - name: Update APM dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apm update --yes
          apm compile --target codex,copilot --validate
          apm compile --target codex,copilot

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No APM baseline update is available.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install validation tools
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          pipx install rumdl==0.2.34

      - name: Validate candidate update
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Invoke-Validation.ps1

      - name: Create candidate patch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/baseline.patch"

      - name: Upload candidate patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-baseline-patch
          path: ${{ runner.temp }}/baseline.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apm-baseline-patch
          path: ${{ runner.temp }}

      - name: Apply data-only candidate patch
        run: |
          git apply --check "$RUNNER_TEMP/baseline.patch"
          git apply --binary --index "$RUNNER_TEMP/baseline.patch"

      - name: Create or update review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch='automation/apm-baseline-update'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git commit -m 'chore(apm): refresh baseline'
          gh auth setup-git
          git push --force-with-lease origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          body_file="$RUNNER_TEMP/apm-update-pr.md"
          pinned_version="$(head -n 1 .apm-version | tr -d '[:space:]')"
          printf '%s\n' \
            '## Summary' \
            '' \
            "- APM CLI candidate: $pinned_version" \
            '- refreshes the APM CLI version pin via the official installer' \
            '- re-resolves branch-ref dependencies with `apm update` and rewrites the lockfile' \
            '- regenerates compiled outputs and runs the full repository validation suite' \
            '' \
            '## Changed files' \
            '' \
            '```text' > "$body_file"
          git show --stat --format= >> "$body_file"
          printf '%s\n' \
            '```' \
            '' \
            'This pull request is intentionally review-only and will not auto-merge.' >> "$body_file"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title 'chore(apm): refresh baseline' --body-file "$body_file"
          else
            gh pr create --base main --head "$branch" \
              --title 'chore(apm): refresh baseline' --body-file "$body_file"
          fi
