name: Update APM baseline

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-apm-baseline
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.release.outputs.version }}
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Acquire currently reviewed APM CLI
        shell: bash
        run: |
          APM_INSTALL_DIR="$RUNNER_TEMP/apm-reviewed/bin" ./scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm-reviewed/bin/apm" >> "$GITHUB_ENV"

      - name: Discover latest APM release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api repos/microsoft/apm/releases/latest --jq '[.tag_name, .published_at] | join(" ")')"
          [ "$(printf '%s\n' "$release" | awk 'END { print NR }')" -eq 1 ]
          latest="${release%% *}"
          latest="${latest#v}"
          published_at="${release#* }"
          printf '%s\n' "$latest" |
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$'
          printf '%s\n' "$published_at" |
            grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          # Cardinality and the strict allowlists above make these outputs injection-safe.
          printf 'version=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          printf 'published_at=%s\n' "$published_at" >> "$GITHUB_OUTPUT"

      - name: Inspect candidate release archives without execution
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/apm-candidate"
          mkdir -p "$candidate_root"

          # The upstream .sha256 sidecar is served from the same release, so
          # agreement only proves the asset was not altered in transit or
          # replaced without its sidecar. Reviewers still confirm the digests.
          fetch_asset() {
            local asset=$1
            for name in "$asset" "$asset.sha256"; do
              curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --output "$candidate_root/$name" \
                "https://github.com/microsoft/apm/releases/download/v$CANDIDATE_VERSION/$name"
            done
            local expected actual
            expected="$(awk 'NR == 1 { print tolower($1) }' "$candidate_root/$asset.sha256")"
            actual="$(sha256sum "$candidate_root/$asset" | awk '{ print $1 }')"
            printf '%s\n' "$expected" | grep -Eq '^[0-9a-f]{64}$'
            [ "$expected" = "$actual" ] || { echo "::error::$asset does not match its upstream .sha256 sidecar"; exit 1; }
          }

          validate_tar() {
            local asset=$1 root=$2 executable=$3 archive="$candidate_root/$asset"
            local extract="$candidate_root/extract-$root"
            tar -tzf "$archive" > "$candidate_root/$root.list"
            tar -tvzf "$archive" > "$candidate_root/$root.verbose"
            awk -v root="$root" -v executable="$executable" '
              BEGIN { valid = 1; executable_count = 0; internal_count = 0 }
              {
                path = $0
                if (path == executable) executable_count++
                if (path != root && path != root "/" && index(path, root "/") != 1) valid = 0
                if (path ~ /^\// || path ~ /(^|\/)\.\.($|\/)/) valid = 0
                if (index(path, root "/_internal/") == 1 && path !~ /\/$/) internal_count++
              }
              END { exit(valid && executable_count == 1 && internal_count > 0 ? 0 : 1) }
            ' "$candidate_root/$root.list"
            awk 'substr($0, 1, 1) != "-" && substr($0, 1, 1) != "d" { exit 1 }' \
              "$candidate_root/$root.verbose"
            mkdir "$extract"
            tar -xzf "$archive" -C "$extract"
            [ -z "$(find "$extract/$root" -type l -print -quit)" ]
            [ -z "$(find "$extract/$root" ! -type d ! -type f -print -quit)" ]
            [ -f "$extract/$executable" ]
          }

          for platform in \
            darwin-arm64 \
            darwin-x86_64 \
            linux-arm64 \
            linux-x86_64; do
            asset="apm-$platform.tar.gz"
            fetch_asset "$asset"
            validate_tar "$asset" "apm-$platform" "apm-$platform/apm"
          done

          windows_asset='apm-windows-x86_64.zip'
          windows_root='apm-windows-x86_64'
          fetch_asset "$windows_asset"
          unzip -Z1 "$candidate_root/$windows_asset" > "$candidate_root/$windows_root.list"
          awk -v root="$windows_root" '
            BEGIN { valid = 1; executable_count = 0; internal_count = 0 }
            {
              path = $0
              gsub(/\\/, "/", path)
              key = tolower(path)
              if (seen[key]++) valid = 0
              if (path == root "/apm.exe") executable_count++
              if (path != root && path != root "/" && index(path, root "/") != 1) valid = 0
              if (path ~ /^\// || path ~ /^[A-Za-z]:/ || path ~ /(^|\/)\.\.($|\/)/) valid = 0
              if (index(path, root "/_internal/") == 1 && path !~ /\/$/) internal_count++
            }
            END { exit(valid && executable_count == 1 && internal_count > 0 ? 0 : 1) }
          ' "$candidate_root/$windows_root.list"
          zipinfo -l "$candidate_root/$windows_asset" |
            awk 'length($1) == 10 && $2 ~ /^[0-9]+\.[0-9]+$/ &&
              substr($1, 1, 1) != "-" && substr($1, 1, 1) != "d" { exit 1 }'
          windows_extract="$candidate_root/extract-$windows_root"
          mkdir "$windows_extract"
          unzip -q "$candidate_root/$windows_asset" -d "$windows_extract"
          [ -z "$(find "$windows_extract/$windows_root" -type l -print -quit)" ]
          [ -z "$(find "$windows_extract/$windows_root" ! -type d ! -type f -print -quit)" ]
          [ -f "$windows_extract/$windows_root/apm.exe" ]

          printf '%s\n' "$CANDIDATE_VERSION" > .apm-version
          {
            for platform in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
              asset="apm-$platform.tar.gz"
              root="apm-$platform"
              printf '%s  %s\n' "$(sha256sum "$candidate_root/$asset" | awk '{ print $1 }')" "$asset"
              printf '%s  %s/apm\n' \
                "$(sha256sum "$candidate_root/extract-$root/$root/apm" | awk '{ print $1 }')" "$root"
            done
            printf '%s  %s\n' \
              "$(sha256sum "$candidate_root/$windows_asset" | awk '{ print $1 }')" "$windows_asset"
            printf '%s  %s/apm.exe\n' \
              "$(sha256sum "$windows_extract/$windows_root/apm.exe" | awk '{ print $1 }')" "$windows_root"
          } > .apm-checksums

      - name: Update APM dependencies with reviewed CLI
        run: |
          "$APM_EXECUTABLE" update --yes
          "$APM_EXECUTABLE" install --frozen --trust-bin
          "$APM_EXECUTABLE" compile --target codex,copilot --validate
          "$APM_EXECUTABLE" compile --target codex,copilot

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No APM baseline update is available.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # The patch is captured before any validation step so that nothing
      # executed from freshly resolved upstream skill content can add files
      # to what the privileged publish job commits. Only data the reviewed
      # CLI regenerates natively may appear in the candidate.
      - name: Create candidate patch from allowlisted paths only
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add --all
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Evx \
            -e '\.apm-version' \
            -e '\.apm-checksums' \
            -e 'apm\.lock\.yaml' \
            -e 'AGENTS\.md' \
            -e '\.github/copilot-instructions\.md' \
            -e '\.github/mcp\.json' \
            -e '\.codex/config\.toml' \
            -e '\.agents/skills/[^/]+/.+' || true)"
          if [ -n "$unexpected" ]; then
            printf '::error::Candidate touches paths outside the reviewed regeneration allowlist:\n%s\n' "$unexpected"
            exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/baseline.patch"

      - name: Install validation tools
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          pipx install rumdl==0.2.34

      - name: Validate candidate update with reviewed CLI
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: ./scripts/Invoke-Validation.ps1

      - name: Upload candidate patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-baseline-patch
          path: ${{ runner.temp }}/baseline.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apm-baseline-patch
          path: ${{ runner.temp }}

      - name: Apply data-only candidate patch
        run: |
          git apply --check "$RUNNER_TEMP/baseline.patch"
          git apply --binary --index "$RUNNER_TEMP/baseline.patch"

      - name: Create or update review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_VERSION: ${{ needs.generate.outputs.version }}
          CANDIDATE_PUBLISHED_AT: ${{ needs.generate.outputs.published_at }}
        run: |
          set -euo pipefail
          branch='automation/apm-baseline-update'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git commit -m 'chore(apm): refresh baseline'
          gh auth setup-git
          git push --force-with-lease origin "$branch"
          # `--head` matches the branch name in any fork, so a fork pull request
          # named like the automation branch could otherwise be selected and
          # rewritten with this trusted body. Accept only this repository's own
          # branch authored by the Actions bot, and fail closed on ambiguity.
          # `gh --json author` renders the Actions app as `app/github-actions`
          # (verified against this repository's automation PRs), not the REST
          # `github-actions[bot]` form; the bare login covers older gh builds.
          candidates="$(gh pr list --base main --head "$branch" --state open \
            --json number,headRepositoryOwner,author,isCrossRepository |
            jq -c --arg owner "$GITHUB_REPOSITORY_OWNER" \
              '[.[] | select(.isCrossRepository == false
                             and .headRepositoryOwner.login == $owner
                             and .author.is_bot == true
                             and (.author.login | test("^(app/)?github-actions$")))]')"
          candidate_count="$(printf '%s' "$candidates" | jq 'length')"
          if [ "$candidate_count" -gt 1 ]; then
            echo "::error::Multiple open automation pull requests match $branch; resolve manually."
            exit 1
          fi
          pr_number="$(printf '%s' "$candidates" | jq -r '.[0].number // empty')"
          body_file="$RUNNER_TEMP/apm-update-pr.md"
          pinned_version="$(head -n 1 .apm-version | tr -d '[:space:]')"
          [ "$pinned_version" = "$CANDIDATE_VERSION" ]
          printf '%s\n' \
            '## Summary' \
            '' \
            "- APM CLI candidate: $pinned_version (upstream release published $CANDIDATE_PUBLISHED_AT)" \
            "- release page: https://github.com/microsoft/apm/releases/tag/v$pinned_version" \
            '- refreshes the CLI pin and reviewed hashes for all five release bundles and executables; every archive matched its upstream `.sha256` sidecar at generation time' \
            '- re-resolves branch-ref dependencies and regenerates compiled outputs with the previously reviewed CLI' \
            '- never executes the candidate CLI in this privileged update workflow' \
            '- contains only allowlisted regenerated paths; validation ran after this patch was captured' \
            '' \
            '## Required review' \
            '' \
            'Review the upstream release, all ten replacement digests, dependency commits, and generated output diff before merging.' \
            '' \
            'After reviewing the candidate changes, select **Approve workflows to run** in this pull request to start candidate CLI validation. Require all validation checks to pass before merging.' \
            '' \
            '## Changed files' \
            '' \
            '~~~text' > "$body_file"
          git show --stat --format= >> "$body_file"
          printf '%s\n' \
            '~~~' \
            '' \
            'This pull request is intentionally review-only and will not auto-merge.' >> "$body_file"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title 'chore(apm): refresh baseline' --body-file "$body_file"
          else
            gh pr create --base main --head "$branch" \
              --title 'chore(apm): refresh baseline' --body-file "$body_file"
          fi
