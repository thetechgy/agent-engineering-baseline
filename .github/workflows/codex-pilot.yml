name: Codex compatibility pilot
run-name: Codex pester-001 pilot (${{ inputs.allocation == '' && 'credential-free' || 'requested allocation' }})
on:
  pull_request:
    paths:
      - '.github/scripts/codex_pilot*.py'
      - '.github/scripts/skill_evidence.py'
      - '.github/evals/codex-pilot.json'
      - '.github/evals/custom-metrics.json'
      - '.github/workflows/codex-pilot.yml'
  workflow_dispatch:
    inputs:
      allocation:
        description: Leave empty for preparation. Approved live allocation is pilot-<exact 40-char commit>-usd10.
        type: string
        default: ''
permissions: {}
concurrency:
  group: codex-compatibility-pilot
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire qualified candidate and verified preparation tools
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-current
          bash .github/scripts/setup-compose.sh
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" bash scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"
      - name: Focused contracts on the intended owning runtime
        id: contracts
        run: '"$SKILL_CURRENT_PYTHON" -B -m unittest discover -s .github/tests -p test_codex_pilot.py -v'
      - name: Complete image builds and real post-upload CLI refusal probes
        timeout-minutes: 20
        run: '"$SKILL_CURRENT_PYTHON" -B .github/scripts/codex_pilot.py probe --output "$RUNNER_TEMP/pilot-probe"'
      - name: Acquire fresh verified Compose configuration for grading
        id: grading-tools
        if: always() && !cancelled() && steps.contracts.outcome == 'success'
        run: |
          echo "PREPARATION_COMPOSE_PLUGIN_ROOT=$COMPOSE_PLUGIN_ROOT" >> "$GITHUB_ENV"
          bash .github/scripts/setup-compose.sh
      - name: Candidate grading through consolidated report with positive and negative controls
        if: always() && !cancelled() && steps.grading-tools.outcome == 'success'
        timeout-minutes: 25
        run: '"$SKILL_CURRENT_PYTHON" -B .github/scripts/codex_pilot.py controls --output "$RUNNER_TEMP/pilot-controls"'
      - name: Verify checkout integrity
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
      - name: Retain preparation, exact submissions, diagnostics and consolidated report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pilot-preparation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pilot-probe/evidence/
            ${{ runner.temp }}/pilot-controls/evidence/
          if-no-files-found: error
          retention-days: 90
  live:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.allocation != '' && github.run_attempt == 1
    environment:
      name: skill-benchmark
      deployment: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Reproduce pinned credential-free runtime preparation
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-current
          bash .github/scripts/setup-compose.sh
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" bash scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"
      - name: Execute approved pair once
        timeout-minutes: 35
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALLOCATION: ${{ inputs.allocation }}
        run: '"$SKILL_CURRENT_PYTHON" -B .github/scripts/codex_pilot.py live --output "$RUNNER_TEMP/pilot-live" --approval "$ALLOCATION"'
      - name: Retain original outcomes and cleanup even after interruption
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pilot-live-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-live/evidence/
          if-no-files-found: error
          retention-days: 90
