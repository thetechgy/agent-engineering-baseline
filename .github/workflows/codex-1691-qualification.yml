name: Codex 0.169.1 fixture qualification
on:
  pull_request:
    paths:
      - '.agents/skills/gh/**'
      - '.github/scripts/codex_resources.py'
      - '.github/scripts/gh_permission_task.py'
      - '.github/evals/campaigns/gh-codex-1691.json'
      - '.github/evals/campaigns/codex-1691.json'
      - '.github/evals/codex-execution-1691.json'
      - '.github/workflows/codex-1691-qualification.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: codex-1691-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  qualify:
    name: Released Codex and native gh permission controls
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Acquire pinned qualification tools
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-next
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" bash scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"
      - name: Probe CLI compatibility and controlled endpoint refusal
        run: "$SKILL_NEXT_PYTHON -B .github/scripts/qualify_codex_1691.py \"$RUNNER_TEMP/cli-probe\""
      - run: bash .github/scripts/setup-compose.sh
      - name: Run existing gh-014 verifier with present and target-absent deployments
        run: |
          "$SKILL_NEXT_PYTHON" -B .github/scripts/evaluation_campaign.py qualify --mode probe \
            --definition .github/evals/campaigns/gh-codex-1691.json \
            --output "$RUNNER_TEMP/codex-qualification"
      - name: Dispose task-owned Compose configuration
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: evidence
        if: always()
        with:
          name: codex-1691-qualification-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-probe/integrity.json
            ${{ runner.temp }}/cli-probe/qualification.json
            ${{ runner.temp }}/cli-probe/compatibility/events.jsonl
            ${{ runner.temp }}/cli-probe/refusal/events.jsonl
            ${{ runner.temp }}/codex-qualification/qualification.json
            ${{ runner.temp }}/codex-qualification/gh-codex-1691/probe/evidence/
            ${{ runner.temp }}/codex-qualification/report/
          if-no-files-found: error
          retention-days: 90
  reproduce:
    name: Reproduce the consolidated report on a fresh runner
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Acquire the pinned report reader
        run: bash .github/scripts/setup-skillevaluator.sh candidate-next
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact-id }}
          path: ${{ runner.temp }}/retained
      - name: Verify native controls and reproduce public report
        run: '"$SKILL_NEXT_PYTHON" -B .github/scripts/verify_codex_1691.py "$RUNNER_TEMP/retained" "$RUNNER_TEMP/reproduction"'
