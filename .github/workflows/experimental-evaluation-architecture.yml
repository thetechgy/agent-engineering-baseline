name: Experimental evaluation architecture (no inference)
on:
  push:
    branches: [experiment/skill-evaluation-architecture]
    paths:
      - investigations/skill-evaluation-architecture/**
      - .github/workflows/experimental-evaluation-architecture.yml
permissions:
  contents: read
concurrency:
  group: experimental-evaluation-architecture
  cancel-in-progress: false
jobs:
  critical-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
          enable-cache: false
      - run: bash .github/scripts/setup-compose.sh
      - name: Prepare verified dependencies and run critical gates
        timeout-minutes: 20
        run: bash investigations/skill-evaluation-architecture/bootstrap.sh
      - name: Retain bounded synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-critical-gates
          path: ${{ runner.temp }}/architecture-poc/public-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove test-only Compose configuration
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
