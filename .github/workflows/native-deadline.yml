name: Native deadline evidence
on:
  workflow_dispatch:
    inputs:
      expect_broken:
        type: boolean
        default: false
        description: Verify the original failure before correction
  pull_request:
    paths:
      - '.github/scripts/codex_pilot*.py'
      - '.github/scripts/evaluation_codex.py'
      - '.github/scripts/qualify_native_deadline.py'
      - '.github/workflows/native-deadline.yml'
permissions: {}
concurrency:
  group: native-deadline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECT_BROKEN: ${{ inputs.expect_broken || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire existing pinned tools
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-current
          bash .github/scripts/setup-compose.sh
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" bash scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"
      - name: Qualify actual native deadlines without inference
        run: |
          args=()
          if [ "$EXPECT_BROKEN" = true ]; then args+=(--expect-broken); fi
          "$SKILL_CURRENT_PYTHON" -B .github/scripts/qualify_native_deadline.py --output "$RUNNER_TEMP/native-deadline" "${args[@]}"
      - name: Dispose task-owned Compose configuration
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-deadline-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-deadline/*/evidence/
            ${{ runner.temp }}/native-deadline/qualification.json
          if-no-files-found: error
          retention-days: 90
