name: Native deadline evidence
on:
  workflow_dispatch:
    inputs:
      cli_observation:
        type: boolean
        default: false
        description: Compare baseline and reviewed CLI observation without inference
      expect_broken:
        type: boolean
        default: false
        description: Verify the original failure before correction
  pull_request:
    paths:
      - '.github/scripts/codex_pilot*.py'
      - '.github/scripts/evaluation_codex.py'
      - '.github/scripts/evaluation_campaign.py'
      - '.github/scripts/evaluation_runtime.py'
      - '.github/scripts/skill_evidence.py'
      - '.github/tests/test_native_deadline.py'
      - '.github/scripts/qualify_native_deadline.py'
      - '.github/workflows/native-deadline.yml'
permissions: {}
concurrency:
  group: native-deadline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ !inputs.cli_observation }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECT_BROKEN: ${{ inputs.expect_broken || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire existing pinned tools
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-current
          bash .github/scripts/setup-compose.sh
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" bash scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"
      - name: Check affected contracts in the owning pinned environment
        run: 'PYTHONPATH=.github/scripts:.github/tests "$SKILL_CURRENT_PYTHON" -B -m unittest test_native_deadline test_codex_events test_evaluation_campaign test_evaluation_protocol -q'
      - name: Qualify actual native deadlines without inference
        run: |
          args=()
          if [ "$EXPECT_BROKEN" = true ]; then args+=(--expect-broken); fi
          "$SKILL_CURRENT_PYTHON" -B .github/scripts/qualify_native_deadline.py --output "$RUNNER_TEMP/native-deadline" "${args[@]}"
      - name: Verify checkout integrity
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
      - name: Dispose task-owned Compose configuration
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-deadline-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-deadline/*/evidence/
            ${{ runner.temp }}/native-deadline/qualification.json
          if-no-files-found: error
          retention-days: 90

  cli-observation:
    if: ${{ inputs.cli_observation }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Acquire existing pinned tools without model credentials
        run: |
          bash .github/scripts/setup-skillevaluator.sh candidate-current
          bash .github/scripts/setup-compose.sh
          APM_INSTALL_DIR="$RUNNER_TEMP/apm/bin" bash scripts/bootstrap.sh --cli-only
          echo "APM_EXECUTABLE=$RUNNER_TEMP/apm/bin/apm" >> "$GITHUB_ENV"
      - name: Compare unchanged base and reviewed head on the same runner
        run: |
          git worktree add --detach "$RUNNER_TEMP/observation-base" a8ab2e2e03a2989863a514df2a6b357c44fbc012
          git worktree add --detach "$RUNNER_TEMP/observation-reviewed" 22b36d53e9ac7e329ef8c56dc9bdcefb468ca9df
          for source in base reviewed; do
            "$SKILL_CURRENT_PYTHON" -B .github/scripts/qualify_cli_observation.py --source "$RUNNER_TEMP/observation-$source" --output "$RUNNER_TEMP/cli-observation/$source"
          done
      - name: Verify checkout integrity
        if: always()
        run: git diff --exit-code
      - name: Dispose task-owned Compose configuration
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup
      - name: Retain sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-observation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-observation/
          if-no-files-found: error
          retention-days: 90
