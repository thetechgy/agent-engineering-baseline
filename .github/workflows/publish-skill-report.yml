name: Publish skill report

on:
  workflow_run:
    workflows: [Validate, Benchmark skills]
    branches: [main]
    types: [completed]
  repository_dispatch:
    types: [recover-skill-report]

permissions: {}

# The native history append job uses this exact group too. Hold it from the
# retained-state read through the exact-commit deployment, including recovery.
concurrency:
  group: skill-report-publication
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'thetechgy/agent-engineering-baseline' &&
      (github.event_name == 'repository_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
      candidate_id: ${{ steps.handoff.outputs.artifact-id }}
      candidate_sha256: ${{ steps.preparation.outputs.candidate_sha256 }}
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: trusted

      - name: Capture trusted main code identity
        id: trusted
        working-directory: trusted
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read retained state after acquiring publication lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
          path: retained

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Install pinned reporting dependencies without scanners or Compose
        working-directory: trusted
        run: bash .github/scripts/setup-skillevaluator.sh reporting

      - name: Authenticate producers and build complete candidate without write permissions
        id: preparation
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETAINED: ${{ github.workspace }}/retained
        run: |
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_pages.py prepare \
            --workspace "$PWD" --retained "$RETAINED" --output "$RUNNER_TEMP/skill-pages-candidate"

      - name: Seal generated handoff
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-pages-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-pages-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  commit:
    needs: prepare
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publication_sha: ${{ steps.commit.outputs.publication_sha }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out trusted publisher code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          persist-credentials: false

      - name: Download generated files from this exact publisher attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.candidate_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/skill-pages-candidate

      - name: Verify generated files and fast-forward durable publication branch
        id: commit
        env:
          CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/skill_pages.py commit \
            --candidate "$RUNNER_TEMP/skill-pages-candidate" --checkout "$RUNNER_TEMP/skill-pages-commit" \
            --seal-digest "$CANDIDATE_SHA256"

      - name: Report durable handoff
        env:
          PUBLICATION_SHA: ${{ steps.commit.outputs.publication_sha }}
        run: printf 'Durable report prepared at `%s`. Site deployment remains a separate outcome.\n' "$PUBLICATION_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: commit
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exactly the committed publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.publication_sha }}
          persist-credentials: false

      - name: Verify static exact-commit handoff without executing report contents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_SHA: ${{ needs.commit.outputs.publication_sha }}
        run: |
          [[ "$PUBLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PUBLICATION_SHA"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" --jq '.object.sha')"
          test "$remote_sha" = "$PUBLICATION_SHA"
          test -f benchmarks/index.html
          test -z "$(find benchmarks ! -type d ! -type f -print -quit)"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload consolidated static report and compatibility paths
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: benchmarks

      - name: Deploy exact publication artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Report site deployment separately from ledger and detailed evidence
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Site deployment: %s.\n' "$DEPLOYMENT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOYMENT_OUTCOME" = success ]; then
            printf '[Canonical skill report](%s)\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Prepared revision remains on gh-pages; previous live deployment is preserved. Rerun or request retained-state recovery.' >> "$GITHUB_STEP_SUMMARY"
          fi
