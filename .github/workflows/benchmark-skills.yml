name: Benchmark skills

on:
  workflow_dispatch:
    inputs:
      skill:
        description: Authored skill or verified evaluation overlay
        required: true
        default: podman
        type: string
      mode:
        description: Standard history run or diagnostic confirmation
        required: true
        default: standard
        type: choice
        options:
          - standard
          - confirmation

permissions: {}

concurrency:
  group: benchmark-skills
  cancel-in-progress: false

jobs:
  evaluate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: skill-benchmark
      deployment: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BENCHMARK_SKILL: ${{ inputs.skill }}
      BENCHMARK_MODE: ${{ inputs.mode }}
    outputs:
      skill: ${{ steps.selection.outputs.skill }}
      history_eligible: ${{ steps.selection.outputs.history_eligible }}
    steps:
      - name: Establish evaluation deadline
        id: budget
        timeout-minutes: 1
        run: printf 'deadline_epoch=%s\n' "$(( $(date +%s) + 9600 ))" >> "$GITHUB_OUTPUT"

      - name: Check out dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate selection and clean checkout
        id: selection
        timeout-minutes: 2
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
          python3 .github/scripts/skill_reports.py select "$BENCHMARK_SKILL" "$BENCHMARK_MODE"

      - name: Install verified pinned Docker Compose
        timeout-minutes: 5
        run: bash .github/scripts/setup-compose.sh

      - name: Verify pinned Docker Compose
        timeout-minutes: 1
        run: test "$(docker compose version --short)" = '5.6.1'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        timeout-minutes: 5
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Install evaluator with Python 3.13 and pinned Codex integration
        timeout-minutes: 15
        run: bash .github/scripts/setup-skillevaluator.sh benchmark

      - name: Validate dataset and runtime before inference
        id: preparation
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/skill-benchmark"
          cp "$RUNNER_TEMP/skill-evaluation-tools/versions.json" "$RUNNER_TEMP/skill-benchmark/versions.json"
          cp -r "$RUNNER_TEMP/skill-evaluation-tools/dependencies" "$RUNNER_TEMP/skill-benchmark/dependencies"
          "$SKILL_EVALUATOR_PYTHON" -m unittest discover -s .github/tests -v
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_reports.py prepare "$RUNNER_TEMP/skill-benchmark" "$BENCHMARK_SKILL"
          skill_dir="$(sed -n 's/^skill_dir=//p' "$GITHUB_OUTPUT")"
          skillevaluator tier3 validate "$skill_dir" --strict --json \
            > "$RUNNER_TEMP/skill-benchmark/dataset-validation.json"
          docker info > /dev/null

      - name: Run native with-skill and without-skill evaluation
        id: evaluation
        timeout-minutes: 145
        env:
          SKILLEVALUATOR_RESULTS_DIR: ${{ runner.temp }}/skill-benchmark/results
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKILL_EVAL_LLM_PROVIDER: openai
          SKILL_EVAL_LLM_MODEL: gpt-5.6-sol
          SKILL_EVAL_JUDGE_MODEL: gpt-5.6-sol
          LLM_JUDGE_MODEL: gpt-5.6-sol
          ATTEMPTS: ${{ steps.selection.outputs.attempts }}
          EVALUATION_DEADLINE_EPOCH: ${{ steps.budget.outputs.deadline_epoch }}
          SKILL_DIR: ${{ steps.preparation.outputs.skill_dir }}
          GRADING_MODE: ${{ steps.preparation.outputs.grading_mode }}
          WORKSPACE_MODE: ${{ steps.preparation.outputs.workspace_mode }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Add OPENAI_API_KEY to the protected skill-benchmark environment before running a paid benchmark.'
            exit 1
          fi
          [[ "$EVALUATION_DEADLINE_EPOCH" =~ ^[0-9]+$ ]]
          evaluation_seconds=$(( EVALUATION_DEADLINE_EPOCH - $(date +%s) - 30 ))
          if (( evaluation_seconds <= 0 )); then
            echo '::error::Benchmark setup exhausted the evaluation deadline.'
            exit 1
          fi
          if (( evaluation_seconds > 8400 )); then
            evaluation_seconds=8400
          fi
          skill_dir="$SKILL_DIR"
          grading_mode="$GRADING_MODE"
          workspace_mode="$WORKSPACE_MODE"
          cd "$RUNNER_TEMP/skill-benchmark"
          # Stop by the deadline, including forced-termination grace, to preserve recovery time.
          timeout --signal=INT --kill-after=30s "${evaluation_seconds}s" skillevaluator tier3 evaluate "$skill_dir" \
            --agents codex --agent-model codex=gpt-5.6-sol --env-mode docker \
            --skill-workspace-mode "$workspace_mode" --grading-mode "$grading_mode" \
            --n-attempts "$ATTEMPTS" --no-stop-on-pass --n-concurrent 2 --max-agents 1 \
            --agent-runtime-preflight --timeout-multiplier 2 --progress plain --harbor-keep-jobs \
            --results-dir "$SKILLEVALUATOR_RESULTS_DIR" \
            --evaluated-source-repository "$GITHUB_REPOSITORY" --evaluated-source-revision "$GITHUB_SHA"

      - name: Recover interrupted native diagnostics
        if: always() && env.SKILL_EVALUATOR_PYTHON != '' && steps.selection.outcome == 'success'
        timeout-minutes: 5
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
        run: |
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_reports.py recover \
            "$RUNNER_TEMP/skill-benchmark" "$BENCHMARK_SKILL" "$BENCHMARK_MODE" "$EVALUATION_OUTCOME"

      - name: Summarize native results and prepare standard metrics
        if: always() && env.SKILL_EVALUATOR_PYTHON != '' && steps.selection.outcome == 'success'
        run: |
          docker version --format '{{json .Server}}' > "$RUNNER_TEMP/skill-benchmark/docker-version.json"
          docker image ls --digests --no-trunc --format '{{json .}}' > "$RUNNER_TEMP/skill-benchmark/docker-images.jsonl"
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_reports.py benchmark \
            "$RUNNER_TEMP/skill-benchmark" "$BENCHMARK_SKILL" "$BENCHMARK_MODE" "$RUNNER_TEMP/skill-metrics"

      - name: Stage allowlisted reports with upstream redaction
        id: artifacts
        if: always() && env.SKILL_EVALUATOR_PYTHON != '' && steps.selection.outcome == 'success'
        run: |
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_reports.py artifacts \
            "$RUNNER_TEMP/skill-benchmark" "$BENCHMARK_SKILL" "$RUNNER_TEMP/skill-benchmark-artifact"

      - name: Verify evaluator left the checkout unchanged
        id: checkout-integrity
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"

      - name: Upload collected benchmark reports and diagnostics
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized standard metrics
        if: success() && inputs.mode == 'standard' && steps.selection.outputs.history_eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-metrics
          path: ${{ runner.temp }}/skill-metrics/metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate validated public benchmark evidence
        id: public-benchmark
        if: always() && env.SKILL_EVALUATOR_PYTHON != '' && steps.selection.outcome == 'success' && steps.selection.outputs.public_supported == 'true'
        timeout-minutes: 3
        continue-on-error: true
        env:
          PUBLIC_SOURCE_KIND: ${{ steps.selection.outputs.public_source_kind }}
        run: |
          public_root="$RUNNER_TEMP/skill-benchmark"
          if [ "$PUBLIC_SOURCE_KIND" = retained ] && [ -f "$RUNNER_TEMP/skill-benchmark-artifact/custom-metric-capture.json" ]; then
            public_root="$RUNNER_TEMP/skill-benchmark-artifact"
          fi
          "$SKILL_EVALUATOR_PYTHON" .github/scripts/skill_reports.py public-benchmark \
            "$public_root" "$BENCHMARK_SKILL" "$BENCHMARK_MODE" "$RUNNER_TEMP/skill-public-benchmark"

      - name: Verify public reporting left the checkout unchanged
        id: public-benchmark-integrity
        if: always() && steps.public-benchmark.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"

      - name: Upload validated public benchmark evidence
        id: public-benchmark-upload
        if: always() && steps.public-benchmark.outcome == 'success' && steps.public-benchmark-integrity.outcome == 'success' && steps.checkout-integrity.outcome == 'success'
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-public-benchmark-${{ steps.selection.outputs.skill }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skill-public-benchmark/inventory/inventory.json
            ${{ runner.temp }}/skill-public-benchmark/skills/*/behavioral/*/public-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Report public evidence handoff status
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        env:
          PUBLIC_GENERATION_OUTCOME: ${{ steps.public-benchmark.outcome }}
          PUBLIC_INTEGRITY_OUTCOME: ${{ steps.public-benchmark-integrity.outcome }}
          PUBLIC_UPLOAD_OUTCOME: ${{ steps.public-benchmark-upload.outcome }}
          PUBLIC_SUPPORTED: ${{ steps.selection.outputs.public_supported }}
        run: |
          if [ "$PUBLIC_SUPPORTED" = false ]; then
            echo 'Public normalization is unavailable for this diagnostic grading contract. Native diagnostics remain separate; history is ineligible.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLIC_GENERATION_OUTCOME" = success ] && [ "$PUBLIC_INTEGRITY_OUTCOME" = success ] && [ "$PUBLIC_UPLOAD_OUTCOME" = success ]; then
            echo 'Public benchmark evidence uploaded.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Public benchmark evidence unavailable; inspect the reporting step. Native history eligibility is unchanged.'
            echo 'Public benchmark evidence unavailable (generation, integrity verification, or upload did not succeed).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove isolated Compose plugin
        if: always()
        run: bash .github/scripts/setup-compose.sh cleanup

  publish-history:
    concurrency:
      group: skill-report-publication
      queue: max
      cancel-in-progress: false
    needs: evaluate
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'standard' && needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.history_eligible == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      history_sha: ${{ steps.commit.outputs.history_sha }}
      history_dir: ${{ steps.metrics.outputs.history_dir }}
    steps:
      - name: Check out trusted dispatched main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download data-only metrics from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-metrics
          path: ${{ runner.temp }}/skill-metrics

      - name: Validate metric allowlist and canonical series
        id: metrics
        env:
          BENCHMARK_SKILL: ${{ needs.evaluate.outputs.skill }}
          BENCHMARK_MODE: ${{ inputs.mode }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/skill_reports.py publish "$RUNNER_TEMP/skill-metrics" "$BENCHMARK_SKILL"

      - name: Append standard result to durable history
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Agent skill benchmark (standard)
          tool: customBiggerIsBetter
          output-file-path: ${{ runner.temp }}/skill-metrics/benchmark.json
          benchmark-data-dir-path: ${{ steps.metrics.outputs.history_dir }}
          gh-pages-branch: gh-pages
          ref: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-always: false
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true

      - name: Capture and verify the exact published history commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          history_sha="$(git rev-parse refs/heads/gh-pages)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" --jq '.object.sha')"
          [[ "$history_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$history_sha" = "$remote_sha"
          printf 'history_sha=%s\n' "$history_sha" >> "$GITHUB_OUTPUT"
