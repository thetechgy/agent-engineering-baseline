version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: UTC
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    groups:
      python-tools:
        patterns: ['*']
        update-types: [minor, patch]
